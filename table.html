<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/png" sizes="256x256" href="/favicon-256.png">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<!-- SSR: table-ssr.mjs rewrites the tags below per edition. Keep them EXACTLY in this
     shape (double quotes, no extra attributes) or the regex replace silently no-ops. -->
<title>The Amabile Table</title>
<meta name="description" content="An invitation to our hosted long-table lunch. By invite only.">
<meta name="robots" content="noindex">
<meta property="og:type" content="website">
<meta property="og:title" content="The Amabile Table">
<meta property="og:description" content="By invite only.">
<meta property="og:image" content="https://www.amabiledirosa.com/assets/images/occasions/dinner.jpg">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="The Amabile Table">
<meta name="twitter:description" content="By invite only.">
<meta name="twitter:image" content="https://www.amabiledirosa.com/assets/images/occasions/dinner.jpg">
<meta name="theme-color" content="#7d1d1d">
<style>
/* This page is the invitation email, rendered live: same palette, same type, same card.
   Only difference is the reply button becomes Yes / No, and a short form follows. */
:root{--wine:#7d1d1d;--paper:#fffdf7;--cream:#efe4cf;--line:#e6d3a8;--ink:#2a1207;--body:#4a3a2c;--gold:#b08d57;--rule:#c9a15a;--mute:#9a8576}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--cream)}
body{font-family:Georgia,"Times New Roman",serif;color:var(--ink);min-height:100vh;padding:34px 14px 40px;-webkit-font-smoothing:antialiased}
.card{max-width:560px;margin:0 auto;background:var(--paper);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.bar{height:6px;background:var(--wine)}
.inner{padding:40px 46px 30px;text-align:center}
.eyebrow{font-family:Arial,Helvetica,sans-serif;font-size:11px;letter-spacing:.34em;text-transform:uppercase;color:var(--gold);margin-bottom:16px}
h1{font-size:30px;line-height:1.15;font-weight:normal;margin:0 0 6px}
.host{font-size:15px;font-style:italic;color:var(--gold)}
.rule{width:46px;height:2px;background:var(--rule);margin:22px auto 24px}
p.body{margin:0 0 16px;font-size:16px;line-height:1.7;color:var(--body);text-align:left}
table.det{border-collapse:collapse;margin:8px auto 28px;text-align:left}
table.det td{padding:9px 0 0;font-size:16px;line-height:1.35;vertical-align:top}
table.det td.l{font-family:Arial,Helvetica,sans-serif;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);padding:13px 18px 0 0;white-space:nowrap}
/* reply */
.yesno{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.pill{cursor:pointer;font-family:Arial,Helvetica,sans-serif;font-weight:bold;font-size:15px;letter-spacing:.03em;padding:15px 34px;border-radius:999px;border:2px solid var(--wine);background:var(--wine);color:var(--paper);transition:opacity .12s,transform .12s}
.pill.no{background:transparent;color:var(--wine)}
.pill:hover{transform:translateY(-1px)}
.pill.sel{box-shadow:0 0 0 3px var(--paper),0 0 0 5px var(--rule)}
.pill:disabled{opacity:.55;cursor:default}
.note{margin:26px 0 0;font-size:13px;color:var(--mute);font-family:Arial,Helvetica,sans-serif;text-align:left;line-height:1.5}
.more{display:none;text-align:left;margin-top:26px;padding-top:22px;border-top:1px solid var(--cream)}
.more.open{display:block}
label{display:block;font-family:Arial,Helvetica,sans-serif;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin:16px 0 6px}
label span{text-transform:none;letter-spacing:0;color:var(--mute)}
input[type=text],input[type=email],input[type=tel],textarea{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:6px;font-family:Georgia,"Times New Roman",serif;font-size:16px;background:#fff;color:var(--ink)}
input:focus,textarea:focus{outline:none;border-color:var(--rule);box-shadow:0 0 0 3px rgba(201,161,90,.25)}
textarea{min-height:76px;resize:vertical}
.send{margin-top:22px;text-align:center}
.err{font-family:Arial,Helvetica,sans-serif;color:var(--wine);font-size:13px;margin-top:12px;text-align:center;min-height:16px}
.status{font-family:Arial,Helvetica,sans-serif;font-size:13px;line-height:1.5;color:var(--body);background:#f7efdc;border:1px solid var(--line);border-radius:6px;padding:10px 14px;margin:0 0 22px;text-align:left}
.status.seated{background:#eef5e2;border-color:#cfe0b5;color:#3b5a1a}
h2{font-size:22px;font-weight:normal;margin:0 0 10px}
.change{display:inline-block;margin-top:22px;cursor:pointer;background:none;border:0;font-family:Arial,Helvetica,sans-serif;font-size:13px;color:var(--mute);text-decoration:underline}
.foot{padding:20px 46px 26px;border-top:1px solid var(--cream);text-align:center}
.foot .b{font-style:italic;font-size:15px;color:#8a6d4a}
.foot .c{font-family:Arial,Helvetica,sans-serif;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#b09a8c;margin-top:6px}
.legal{text-align:center;margin-top:22px;font-family:Arial,Helvetica,sans-serif;font-size:12px}
.legal a{color:var(--gold)}
@media(max-width:480px){.inner{padding:32px 24px 26px}.foot{padding:18px 24px 22px}.pill{padding:14px 26px;width:100%}}
</style>
</head>
<body>
<div class="card">
  <div class="bar"></div>
  <div class="inner" id="app"><h2>Setting the table…</h2></div>
  <div class="foot"><div class="b">Amabile di Rosa</div><div class="c">Lagos, Nigeria</div></div>
</div>
<div class="legal"><a href="https://www.amabiledirosa.com/privacy.html">Privacy</a></div>

<script>
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}
function qs(k){return new URLSearchParams(location.search).get(k)||"";}
var _pm=(location.pathname||"").match(/\/table\/([A-Za-z0-9-]+)/);
var ED=(qs("e")||(_pm?_pm[1]:"")).toLowerCase().replace(/[^a-z0-9-]/g,"");
var TOKEN=qs("g").replace(/[^A-Za-z0-9_-]/g,"");
/* Email buttons carry the answer (&r=yes / &r=no). It pre-selects and opens the form; the
   guest still confirms with one tap, so link pre-fetching by mail scanners cannot reply. */
var PRE=qs("r")==="yes"?"yes":(qs("r")==="no"?"no":"");
var app=document.getElementById("app");
var DATA=null;

/* attribution, persisted so navigating away and back doesn't lose it */
var ATTR=(function(){
  try{var s=sessionStorage.getItem("adr_table_attr");if(s)return s;}catch(e){}
  var q=new URLSearchParams(location.search);
  var touch=/Mobi|Android|iPhone|iPad|iPod/i.test(navigator.userAgent)||(window.matchMedia&&matchMedia('(pointer:coarse)').matches);
  var a=[q.get("utm_source")||"",q.get("utm_medium")||"",q.get("utm_campaign")||"",q.get("ref")||"",touch?"mobile":"desktop"].join("|");
  try{sessionStorage.setItem("adr_table_attr",a);}catch(e){}
  return a;
})();

load();

function fail(msg,head){app.innerHTML='<div class="eyebrow">The Amabile Table</div><h2>'+esc(head||"Hmm.")+'</h2><p class="body" style="text-align:center">'+esc(msg)+'</p>';}

function load(){
  if(!ED){fail("This link is missing its edition.");return;}
  fetch("/.netlify/functions/table-data?e="+encodeURIComponent(ED)+"&g="+encodeURIComponent(TOKEN))
    .then(function(r){return r.json();})
    .then(function(d){
      if(!d||!d.ok){fail("We couldn't find that Table.");return;}
      if(!d.invited){fail("The Amabile Table is by invitation, and this link is not carrying a personal invite. Please open the exact link from your email.","A closed room");return;}
      DATA=d;render();
    })
    .catch(function(){fail("Something went wrong loading your invite. Try again in a moment.");});
}

/* The invitation itself: identical to the email, top to the details table. */
function head(){
  var e=DATA.edition, g=DATA.guest||{};
  var first=((g.name||"").split(" ")[0]);
  var host=e.hostName||"Amabile di Rosa";
  var timing=e.timeLabel?esc(e.timeLabel)+" prompt"+(e.seatedByLabel?", seated by "+esc(e.seatedByLabel):""):"";
  var when=esc(e.dateLabel||"")+(timing?"<br>"+timing:"");
  var row=function(l,v){return v?'<tr><td class="l">'+l+'</td><td>'+v+'</td></tr>':"";};
  var paras=String(e.cardParagraph||"").split(/\n{2,}|\n/).filter(Boolean).map(function(p){return '<p class="body">'+esc(p)+'</p>';}).join("");
  return '<div class="eyebrow">The Amabile Table</div>'+
    '<h1>'+esc(e.title||"The Amabile Table")+'</h1>'+
    '<div class="host">Hosted by '+esc(host)+'</div>'+
    '<div class="rule"></div>'+
    '<p class="body">Ciao '+esc(first||"there")+',</p>'+paras+
    '<table class="det">'+row("When",when)+row("Where",esc(e.venue||""))+'</table>';
}
var PLUS='<p class="note">This invitation is personal to you. Seating is planned per person, so we are not able to accommodate plus-ones.</p>';

function render(){
  var e=DATA.edition, y=DATA.your||{};
  if(e.closed){app.innerHTML=head()+'<h2>Replies are closed.</h2><p class="body" style="text-align:center">The list for this edition is now set. We will invite you to the next one.</p>';return;}
  // Returning guests see the invitation with their answer selected and can change it.
  renderForm();
}

function renderStatus(){
  var y=DATA.your||{}, e=DATA.edition;
  var h,b;
  if(y.response==="yes"&&y.status==="seated"){h="Your seat is confirmed.";b="We will see you at "+(e.title||"the Table")+".";}
  else if(y.response==="yes"&&y.status==="wait"){h="You are on the waitlist, position "+y.position+".";b="If a seat opens we will email you. There is nothing you need to do.";}
  else{h="Noted, thank you.";b="Sorry you cannot make this one. We will keep you in mind for the next edition.";}
  app.innerHTML=head()+'<h2>'+esc(h)+'</h2><p class="body" style="text-align:center">'+esc(b)+'</p>'+
    '<button class="change" id="changeBtn">Change my reply</button>'+PLUS;
  document.getElementById("changeBtn").addEventListener("click",renderForm);
}

function renderForm(){
  var y=DATA.your||{}, s=DATA.summary||{};
  var full=s.full && y.status!=="seated";
  var replied=y.response==="yes"||y.response==="no";
  var needEmail=!((DATA.guest||{}).hasEmail)&&!y.email; // only when the invitation carries no email
  var bar="";
  if(replied){
    if(y.response==="yes"&&y.status==="seated")bar='<div class="status seated">You replied yes, and your seat is confirmed. Change your reply below if plans change.</div>';
    else if(y.response==="yes")bar='<div class="status">You replied yes and are on the waitlist, position '+esc(y.position)+'. Change your reply below if plans change.</div>';
    else bar='<div class="status">You replied that you cannot make it. Change your reply below if plans change.</div>';
  }
  if(full)bar+='<div class="status">The table is currently full. Saying yes adds you to the waitlist, and we will email you the moment a seat opens.</div>';
  app.innerHTML=head()+bar+
    '<div class="yesno"><button class="pill yes" id="bYes">Yes, I will be there</button><button class="pill no" id="bNo">I cannot make it</button></div>'+
    '<div class="more" id="more">'+
      '<div id="yesFields">'+
        (needEmail?'<label for="fEmail">Email <span>(so we can confirm your seat)</span></label><input type="email" id="fEmail" autocomplete="email" value="'+esc(y.email||"")+'">':'')+
        '<label for="fNotes">Dietary needs <span>(optional)</span></label><input type="text" id="fNotes" value="'+esc(y.notes||"")+'">'+
      '</div>'+
      '<div class="send"><button class="pill" id="go">Send my reply</button></div>'+
      '<div class="err" id="ferr"></div>'+
    '</div>'+PLUS;

  var resp=PRE||y.response||"", more=document.getElementById("more");PRE="";
  var bYes=document.getElementById("bYes"),bNo=document.getElementById("bNo");
  var yesFields=document.getElementById("yesFields"),go=document.getElementById("go");
  function choose(r){resp=r;bYes.classList.toggle("sel",r==="yes");bNo.classList.toggle("sel",r==="no");
    more.classList.add("open");yesFields.style.display=r==="yes"?"block":"none";
    go.textContent=replied?"Update my reply":(r==="yes"?(full?"Join the waitlist":"Confirm my seat"):"Send my reply");
    if(r==="yes"&&needEmail)setTimeout(function(){document.getElementById("fEmail").focus();},80);}
  bYes.addEventListener("click",function(){choose("yes");});
  bNo.addEventListener("click",function(){choose("no");});
  if(resp)choose(resp);

  go.addEventListener("click",function(){
    var errEl=document.getElementById("ferr");errEl.textContent="";
    if(!resp){errEl.textContent="Choose yes or no first.";return;}
    var body={edition:ED,token:TOKEN,response:resp,attr:ATTR};
    if(resp==="yes"&&needEmail){
      var email=document.getElementById("fEmail").value.trim();
      if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)){errEl.textContent="Add a valid email so we can confirm.";return;}
      body.email=email;
    }
    body.notes=resp==="yes"?document.getElementById("fNotes").value.trim():"";
    go.disabled=true;go.textContent="Sending…";
    fetch("/.netlify/functions/table-rsvp",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)})
      .then(function(r){return r.json().catch(function(){return{};});})
      .then(function(d){
        if(!d||!d.ok){go.disabled=false;go.textContent="Send my reply";errEl.textContent=d&&d.error==="closed"?"Replies just closed for this edition.":"Something went wrong. Please try again.";return;}
        DATA.your={response:resp,status:d.status,position:d.position,email:body.email||y.email||"",notes:body.notes};
        DATA.summary=d.summary||DATA.summary;
        renderStatus();window.scrollTo(0,0);
      })
      .catch(function(){go.disabled=false;go.textContent="Send my reply";errEl.textContent="Network hiccup. Please try again.";});
  });
}
</script>
</body>
</html>
