<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#FAF7F1">
<title>The Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
:root{
  --paper:#FAF7F1; --ink:#1C1714; --muted:#6F655C; --line:#E4DCCF; --card:#FFFDF9;
  --wine:#7A1F1F; --wine-ink:#FFF7F2; --gold:#B08D57; --soft:#F1EAE0;
  --R:#7A1F1F; --F:#B08D57; --T:#2F3C7E; --C:#2C5F2D; --P:#6D2E46;
  --shadow:0 1px 0 rgba(28,23,20,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#17130F; --ink:#F1EBE1; --muted:#A79C8F; --line:#332C25; --card:#1F1A15;
    --wine:#B24A4A; --wine-ink:#FFF3EE; --gold:#C9A76A; --soft:#26201A;
    --R:#C96A6A; --F:#C9A76A; --T:#8391D6; --C:#6FA870; --P:#B9799A;
    --shadow:none;
  }
}
:root[data-theme="dark"]{
  --paper:#17130F; --ink:#F1EBE1; --muted:#A79C8F; --line:#332C25; --card:#1F1A15;
  --wine:#B24A4A; --wine-ink:#FFF3EE; --gold:#C9A76A; --soft:#26201A;
  --R:#C96A6A; --F:#C9A76A; --T:#8391D6; --C:#6FA870; --P:#B9799A;
  --shadow:none;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"Instrument Sans",-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;font-size:16px;line-height:1.35;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.wrap{max-width:1040px;margin:0 auto;padding-inline:16px;padding-block:0 48px}
header.top{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:1px solid var(--line);padding-block:14px 10px}
.row1{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
h1{font-family:Fraunces,Georgia,serif;font-weight:500;font-size:28px;margin:0;letter-spacing:-.01em}
h1 small{font-family:"Instrument Sans",sans-serif;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-left:10px;font-weight:500}
.count{font-family:Fraunces,Georgia,serif;font-size:26px;font-variant-numeric:tabular-nums;white-space:nowrap}
.count b{font-weight:600;color:var(--wine)}
.count span{color:var(--muted);font-size:15px;font-family:"Instrument Sans",sans-serif;margin-left:4px}
.row2{display:flex;gap:8px;margin-top:10px}
.search{flex:1;display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:0 14px;height:42px}
.search svg{flex:none;opacity:.55}
.search input{flex:1;border:0;background:transparent;font:inherit;font-size:16px;color:var(--ink);min-width:0;outline:none}
.search input::placeholder{color:var(--muted)}
.copy{height:42px;padding:0 14px;border:1px solid var(--line);border-radius:999px;background:var(--card);font-weight:500;white-space:nowrap;font-size:14px}
.copy.done{border-color:var(--wine);color:var(--wine)}
.filters{display:flex;gap:6px;margin-top:10px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.filters::-webkit-scrollbar{display:none}
.filters button{flex:none;height:32px;padding:0 13px;border-radius:999px;border:1px solid var(--line);color:var(--muted);font-size:14px;font-weight:500;background:var(--card)}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.sec{font-family:Fraunces,Georgia,serif;font-style:italic;font-size:19px;color:var(--muted);margin:24px 0 8px;display:flex;align-items:baseline;gap:10px}
.sec::after{content:"";flex:1;height:1px;background:var(--line);transform:translateY(-6px)}
.grid{display:grid;grid-template-columns:1fr;gap:10px}
@media (min-width:680px){.grid{grid-template-columns:1fr 1fr}}
@media (min-width:980px){.grid{grid-template-columns:1fr 1fr 1fr}}
.card{display:grid;grid-template-columns:64px 1fr 48px;gap:0 14px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 12px 12px 12px;box-shadow:var(--shadow);position:relative}
.card.in{border-color:color-mix(in srgb, var(--wine) 45%, var(--line))}
.card.in .face{outline:3px solid var(--wine);outline-offset:2px}
.face{align-self:start;margin-top:2px;width:64px;height:64px;border-radius:50%;overflow:hidden;background:var(--soft);display:grid;place-items:center;font-family:Fraunces,Georgia,serif;font-size:22px;color:var(--wine);}
.face img{width:100%;height:100%;object-fit:cover;display:block}
.face.logo img{object-fit:contain;padding:8px;background:#fff}
.mid{min-width:0;align-self:start;padding-bottom:6px}
.name{font-size:19px;font-weight:600;line-height:1.15;margin:2px 0 0;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px}
.name .seat{font-family:Fraunces,Georgia,serif;font-weight:500;font-size:15px;color:var(--gold);letter-spacing:.02em;font-variant-numeric:tabular-nums}
.name .grp{font-size:11px;font-weight:600;letter-spacing:.08em;width:18px;height:18px;border-radius:50%;display:inline-grid;place-items:center;color:#fff;transform:translateY(-2px)}
.sub{color:var(--muted);font-size:13px;margin-top:1px}
.who{margin-top:5px;font-size:14.5px;line-height:1.35}
.bring{margin-top:6px;font-size:14px;color:var(--muted);display:flex;gap:6px;align-items:baseline}
.bring::before{content:"→";color:var(--gold);flex:none;font-family:Fraunces,Georgia,serif}
.bring i{font-style:italic;color:var(--ink)}
.flag{margin-top:6px;font-size:12.5px;color:var(--wine);font-style:italic}
.chk{align-self:center;justify-self:end;width:46px;height:46px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;color:transparent;background:var(--paper);transition:background .15s,border-color .15s}
.chk svg{width:22px;height:22px}
.card.in .chk{background:var(--wine);border-color:var(--wine);color:var(--wine-ink)}
.stamp{position:absolute;right:14px;bottom:8px;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;letter-spacing:.04em}
.empty{color:var(--muted);font-style:italic;padding:24px 4px}
.legend{margin-top:28px;font-size:13px;color:var(--muted);line-height:1.6}
.legend b{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;color:#fff;font-size:10px;font-weight:600;margin-right:4px;transform:translateY(2px)}
.foot{display:flex;justify-content:space-between;align-items:center;margin-top:22px;font-size:13px;color:var(--muted)}
.foot button{text-decoration:underline;text-underline-offset:3px;color:var(--muted)}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="row1">
      <h1>The Room <small>Table No 1</small></h1>
      <div class="count"><b id="cin">0</b>/<span id="ctot" style="margin:0;font-family:Fraunces,Georgia,serif;font-size:26px;color:var(--ink)">0</span><span>in</span></div>
    </div>
    <div class="row2">
      <label class="search">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="Name, restaurant, seat" autocomplete="off" autocorrect="off" autocapitalize="off">
      </label>
      <button class="copy" id="copy" type="button">Copy who's in</button>
    </div>
    <div class="filters" id="filters" role="group" aria-label="Show">
      <button type="button" data-f="all" aria-pressed="true">Everyone</button>
      <button type="button" data-f="out" aria-pressed="false">Not yet</button>
      <button type="button" data-f="in" aria-pressed="false">In</button>
      <button type="button" data-f="A" aria-pressed="false">Side A</button>
      <button type="button" data-f="B" aria-pressed="false">Side B</button>
    </div>
  </header>

  <main id="list"></main>

  <p class="legend"><b style="background:var(--R)">R</b> Roy, Vivian, Charbel keep apart. <b style="background:var(--F)">F</b> Alliance Française people spread out. <b style="background:var(--T)">T</b> Tega, Jerry, Bola apart. <b style="background:var(--C)">C</b> the two caterers apart. <b style="background:var(--P)">P</b> planners apart. Seat codes are ours. Guests never hear them.</p>
  <div class="foot"><span>Ticks live on this phone only. Copy the list into the group when it changes.</span><button type="button" id="reset">Reset ticks</button></div>
</div>

const KEY='room-in-t1';
let IN={};
try{IN=JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch(e){IN={}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(IN))}catch(e){}}
let filter='all', q='';

const byId={}; GUESTS.forEach(g=>byId[g.id]=g);
const guests=GUESTS.filter(g=>!g.us&&!g.pending);

function initials(n){return n.split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase()}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function hm(t){const d=new Date(t);return d.getHours()+':'+String(d.getMinutes()).padStart(2,'0')}

function card(g){
  const isIn=!!IN[g.id];
  const seat=g.seat?g.side+g.seat:(g.new?'seat tbc':'');
  const faceHtml=g.img?`<img src="${g.img}" alt="">`:esc(initials(g.n));
  return `<article class="card${isIn?' in':''}" data-id="${g.id}">
    <div class="face${g.logo?' logo':''}">${faceHtml}</div>
    <div class="mid">
    <h2 class="name">${esc(g.n)}${seat?` <span class="seat">${esc(seat)}</span>`:''}${g.g?` <span class="grp" style="background:var(--${g.g})">${g.g}</span>`:''}</h2>
    ${g.sub?`<div class="sub">${esc(g.sub)}</div>`:''}
    <div class="who">${esc(g.who)}</div>
    ${g.bring?`<div class="bring"><span>While standing, bring to <i>${esc(g.bring)}</i></span></div>`:''}
    ${g.unsure?`<div class="flag">${esc(g.unsure)}</div>`:''}
    </div>
    <button class="chk" type="button" aria-label="${isIn?'Mark not here':'Mark in the room'}" aria-pressed="${isIn}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5"/></svg></button>
    ${isIn?`<span class="stamp">in ${hm(IN[g.id])}</span>`:''}
  </article>`;
}

function matches(g){
  if(q){const s=(g.n+' '+(g.sub||'')+' '+g.who+' '+g.side+g.seat).toLowerCase(); if(!s.includes(q)) return false;}
  if(filter==='in') return !!IN[g.id];
  if(filter==='out') return !IN[g.id]&&!g.us&&!g.pending;
  if(filter==='A'||filter==='B') return g.side===filter;
  return true;
}
function section(title,items){
  if(!items.length) return '';
  return `<h3 class="sec">${title}</h3><div class="grid">${items.map(card).join('')}</div>`;
}
function render(){
  const seated=g=>g.seat>0;
  const A=GUESTS.filter(g=>g.side==='A'&&matches(g)).sort((a,b)=>a.seat-b.seat);
  const B=GUESTS.filter(g=>g.side==='B'&&matches(g)).sort((a,b)=>a.seat-b.seat);
  const N=GUESTS.filter(g=>g.new&&matches(g));
  const P=GUESTS.filter(g=>g.pending&&matches(g));
  let html='';
  if(filter==='in'){
    const all=GUESTS.filter(matches).sort((a,b)=>(IN[b.id]||0)-(IN[a.id]||0));
    html=section('In the room, latest first',all);
  }else{
    html=section('Side A, door to far end',A)+section('Side B, door to far end',B)+section('New, seats to confirm',N);
  }
  document.getElementById('list').innerHTML=html||'<p class="empty">Nobody matches that.</p>';
  document.getElementById('cin').textContent=guests.filter(g=>IN[g.id]).length;
  document.getElementById('ctot').textContent=guests.length;
}

document.getElementById('list').addEventListener('click',e=>{
  const b=e.target.closest('.chk'); if(!b) return;
  const id=b.closest('.card').dataset.id;
  if(IN[id]) delete IN[id]; else IN[id]=Date.now();
  save(); render();
});
document.getElementById('filters').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  filter=b.dataset.f;
  [...e.currentTarget.children].forEach(x=>x.setAttribute('aria-pressed',x===b));
  render();
});
document.getElementById('q').addEventListener('input',e=>{q=e.target.value.trim().toLowerCase();render();});
document.getElementById('reset').addEventListener('click',()=>{IN={};save();render();});
document.getElementById('copy').addEventListener('click',async()=>{
  const inn=guests.filter(g=>IN[g.id]).sort((a,b)=>IN[a.id]-IN[b.id]).map(g=>g.n);
  const out=guests.filter(g=>!IN[g.id]).map(g=>g.n);
  const txt=`In the room ${inn.length}/${guests.length}: ${inn.join(', ')||'nobody yet'}.\nStill to come: ${out.join(', ')||'nobody'}.`;
  const b=document.getElementById('copy');
  try{await navigator.clipboard.writeText(txt);b.textContent='Copied';b.classList.add('done');}
  catch(e){window.prompt('Copy this',txt);}
  setTimeout(()=>{b.textContent="Copy who's in";b.classList.remove('done')},1600);
});
render();
</script>
</body>
</html>
