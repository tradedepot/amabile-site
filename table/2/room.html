<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#141210">
<title>The Room</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400;1,9..144,600&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
:root{
  --ground:#141210; --ground2:#241F1A; --linen:#F4E9D6; --linen2:#E7D6BC; --ink:#FBF3E6; --muted:#B9AC9C; --dim:#7D7266;
  --gold:#E8C37A; --gold2:#B08D57; --rosa:#F2A7B5; --wine:#8E1E2E; --sheet:#1B1814; --line:rgba(232,195,122,.2);
}
*{box-sizing:border-box}
html{color-scheme:dark}
body{margin:0;background:var(--ground);color:var(--ink);font-family:"Instrument Sans",-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;font-size:15px;line-height:1.35;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.app{max-width:560px;margin:0 auto;padding-inline:14px;padding-block:0 60vh;position:relative}
.top{position:sticky;top:0;z-index:6;background:linear-gradient(var(--ground) 82%,rgba(20,18,16,0));padding-block:12px 10px}
.row1{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
h1{font-family:Fraunces,Georgia,serif;font-weight:400;font-size:30px;margin:0;letter-spacing:-.01em;color:var(--linen)}
h1 em{font-style:italic;color:var(--gold)}
.count{font-family:Fraunces,Georgia,serif;font-size:28px;font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--linen)}
.count b{font-weight:600;color:var(--rosa)}
.count span{font-family:"Instrument Sans",sans-serif;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-left:6px}
.row2{display:flex;gap:8px;margin-top:8px}
.search{flex:1;display:flex;align-items:center;gap:8px;background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:999px;padding:0 14px;height:40px}
.search svg{flex:none;opacity:.7;color:var(--gold)}
.search input{flex:1;border:0;background:transparent;font:inherit;font-size:16px;color:var(--ink);min-width:0;outline:none}
.search input::placeholder{color:var(--dim)}
.copy{height:40px;padding:0 14px;border:1px solid var(--line);border-radius:999px;background:rgba(0,0,0,.25);font-weight:500;white-space:nowrap;font-size:13px;color:var(--gold)}
.copy.done{background:var(--gold);color:var(--ground)}
.threads{display:flex;gap:6px;margin-top:10px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px;margin-inline:-14px;padding-inline:14px}
.threads::-webkit-scrollbar{display:none}
.tchip{flex:none;height:32px;padding:0 12px 0 8px;border-radius:999px;border:1px solid var(--line);background:rgba(0,0,0,.25);font-size:13px;font-weight:500;color:var(--linen);display:inline-flex;align-items:center;gap:7px}
.tchip i{width:10px;height:10px;border-radius:50%;background:var(--c);box-shadow:0 0 0 2px rgba(0,0,0,.25),0 0 10px var(--c)}
.tchip[aria-pressed="true"]{background:var(--c);color:#141210;border-color:var(--c);font-weight:600}
.tchip[aria-pressed="true"] i{background:#141210;box-shadow:none}
.stage{position:relative;margin-top:6px}
svg.table{width:100%;height:auto;display:block;overflow:visible}
.ends{font-family:"Instrument Sans",sans-serif;font-size:9px;letter-spacing:.22em;fill:var(--gold);font-weight:600}
.seatcode{font-family:Fraunces,Georgia,serif;font-size:10px;fill:var(--gold);font-weight:600;letter-spacing:.04em}
.nm{font-family:"Instrument Sans",sans-serif;font-size:11.5px;fill:var(--linen);font-weight:500;text-anchor:middle}
.nm.us{fill:var(--rosa)}
.initial{font-family:Fraunces,Georgia,serif;font-size:20px;fill:var(--gold);text-anchor:middle;font-weight:600}
g.face{cursor:pointer;transition:opacity .25s}
g.face .ring{fill:none;stroke:var(--gold2);stroke-width:1.2;opacity:.8}
g.face .hit{fill:transparent}
g.face.us .ring{stroke:var(--rosa);stroke-width:2}
g.face .in{fill:var(--rosa);stroke:var(--ground);stroke-width:2;display:none}
g.face.isin .in{display:block}
g.face.sel .ring{stroke:var(--linen);stroke-width:3;opacity:1}
g.face.lit .ring{stroke:var(--hl,var(--gold));stroke-width:3;opacity:1;filter:drop-shadow(0 0 6px var(--hl,var(--gold)))}
.stage.focus g.face:not(.sel):not(.lit){opacity:.22}
path.edge{fill:none;stroke:var(--gold);stroke-width:1;opacity:.11;transition:opacity .25s,stroke-width .25s}
.stage.focus path.edge{opacity:.04}
.stage.focus path.edge.lit{opacity:.95;stroke-width:2.2;stroke:var(--hl,var(--gold));filter:drop-shadow(0 0 4px var(--hl,var(--gold)))}
g.lbl{cursor:pointer}
g.lbl rect.hit{fill:transparent;stroke:none}
g.lbl rect{fill:#141210;stroke:var(--hl,var(--gold));stroke-width:1;rx:9}
g.lbl text{font-family:"Instrument Sans",sans-serif;font-size:10px;font-weight:600;fill:var(--linen);text-anchor:middle;dominant-baseline:middle}
rect.linen{fill:var(--linen);stroke:var(--gold);stroke-width:1.5}
text.tname{font-family:Fraunces,Georgia,serif;font-size:10px;letter-spacing:.3em;fill:var(--gold2);text-anchor:middle;writing-mode:vertical-rl}
.stage.dimmed g.face.off{opacity:.15}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--sheet);color:var(--ink);border-radius:22px 22px 0 0;box-shadow:0 -12px 40px rgba(0,0,0,.5);max-height:62vh;overflow-y:auto;transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);border-top:1px solid var(--line)}
.sheet.open{transform:translateY(0)}
.sheet .inner{max-width:560px;margin:0 auto;padding:10px 18px 28px;position:relative}
.grab{width:38px;height:4px;border-radius:2px;background:rgba(255,255,255,.25);margin:0 auto 12px}
.sh{display:flex;gap:14px;align-items:center}
.pf{border-radius:50%;overflow:hidden;background:var(--ground2);flex:none;display:grid;place-items:center;font-family:Fraunces,Georgia,serif;color:var(--gold)}
.pf img{width:100%;height:100%;object-fit:cover;display:block}
.pf.logo img{object-fit:contain;padding:8px;background:#fff}
.sh .pf{width:64px;height:64px;border:2px solid var(--gold2);font-size:24px}
.hero{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;padding-top:4px}
.hero .pf{width:200px;height:200px;border:3px solid var(--gold);box-shadow:0 0 0 6px rgba(232,195,122,.12),0 12px 40px rgba(0,0,0,.6);font-size:56px}
.hero h2{font-family:Fraunces,Georgia,serif;font-weight:600;font-size:28px;margin:0;line-height:1.05;color:var(--linen)}
.hero h2 small{font-family:Fraunces,Georgia,serif;font-weight:400;font-size:16px;color:var(--gold);margin-left:8px}
.hero .sub{color:var(--muted);font-size:14px}
.hero .who{font-size:15px;color:var(--ink);max-width:34ch}
.hero .inbtn{margin:6px 0 0;width:auto;height:44px;padding:0 18px;border-radius:999px;display:inline-flex;align-items:center;gap:8px;color:var(--muted);font-size:14px;font-weight:500}
.hero .inbtn svg{width:18px;height:18px;color:transparent}
.hero .inbtn.on{color:#141210}
.hero .inbtn.on svg{color:#141210}
.sh h2{font-family:Fraunces,Georgia,serif;font-weight:600;font-size:24px;margin:0;line-height:1.1;color:var(--linen)}
.sh h2 small{font-family:Fraunces,Georgia,serif;font-weight:400;font-size:15px;color:var(--gold);margin-left:8px;letter-spacing:.04em}
.sh .sub{color:var(--muted);font-size:13px;margin-top:2px}
.sh .who{font-size:14px;margin-top:4px;color:var(--ink)}
.inbtn{margin-left:auto;flex:none;width:52px;height:52px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;color:transparent;background:rgba(255,255,255,.04)}
.inbtn svg{width:24px;height:24px}
.inbtn.on{background:var(--rosa);border-color:var(--rosa);color:#141210}
.flag{margin-top:10px;font-size:12.5px;color:var(--rosa);font-style:italic}
.flag.diet{color:var(--gold);font-style:normal;font-weight:500}
.note{margin-top:10px;font-size:12px;color:var(--dim);line-height:1.4}
.k{margin:14px 0 0;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);font-weight:600}
.bring{display:flex;align-items:center;gap:12px;margin-top:8px;background:rgba(232,195,122,.08);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.bring .pf{width:44px;height:44px}
.bring b{display:block;font-size:15px;color:var(--linen)}
.bring span{font-size:13px;color:var(--muted)}
.tchips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tchips .tchip{height:28px;font-size:12px}
.people{margin-top:8px;display:grid;gap:6px}
.prow{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.035);border-radius:14px;padding:8px 10px;text-align:left;width:100%;border:1px solid transparent}
.prow.on{border-color:var(--gold);background:rgba(232,195,122,.1)}
.prow .pf{width:40px;height:40px;border:2px solid var(--c,var(--gold2))}
.prow .t{min-width:0;flex:1}
.prow .t b{display:block;font-size:15px;color:var(--linen)}
.prow .t span{display:block;font-size:13px;color:var(--gold)}
.prow .t em{display:none;font-style:normal;font-size:13px;color:var(--ink);margin-top:4px;line-height:1.35}
.prow.on .t em{display:block}
ul.know{margin:6px 0 0;padding:0 0 0 16px;font-size:14px;line-height:1.4;color:var(--ink)}
ul.know li{margin:0 0 5px}
ul.know li::marker{color:var(--gold)}
.tline{font-size:15px;line-height:1.45;margin-top:8px;color:var(--ink)}
.members{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.members button{display:flex;flex-direction:column;align-items:center;gap:4px;width:64px}
.members .pf{width:52px;height:52px;border:2.5px solid var(--c)}
.members span{font-size:11px;color:var(--linen);text-align:center;line-height:1.1}
.close{position:absolute;left:14px;top:10px;width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.08);display:grid;place-items:center;color:var(--muted);font-size:18px}
.foot{margin-top:18px;font-size:12px;color:var(--dim);display:flex;justify-content:center}
.foot button{color:var(--dim);white-space:nowrap;padding:8px 14px;border:1px solid rgba(255,255,255,.08);border-radius:999px}
.toast{white-space:nowrap;position:fixed;left:50%;bottom:28px;transform:translate(-50%,12px);z-index:9;background:var(--gold);color:#141210;font-size:13px;font-weight:600;padding:9px 16px;border-radius:999px;opacity:0;transition:all .3s;pointer-events:none;box-shadow:0 8px 24px rgba(0,0,0,.5)}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="row1">
      <h1>The <em>Room</em></h1>
      <div class="count"><b id="cin">0</b>/<span id="ctot" style="margin:0;font-family:Fraunces,Georgia,serif;font-size:28px;letter-spacing:0;text-transform:none;color:var(--linen)">0</span><span>in</span></div>
    </div>
    <div class="row2">
      <label class="search">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="Find a face" autocomplete="off" autocorrect="off" autocapitalize="off">
      </label>
      <button class="copy" id="copy" type="button">Copy who's in</button>
    </div>
    <div class="threads" id="threads"></div>
    <div class="note">Table No 2, Panu Lagos, Friday 23 October. Dolapo Morgan hosts. Seats are provisional until the plan lands.</div>
  </header>

  <div class="stage" id="stage"><svg class="table" id="svg"></svg></div>

  <div class="foot"><button type="button" id="reset">Reset ticks</button></div>
</div>

<div class="sheet" id="sheet"><div class="inner" id="sheetIn"></div></div>

const THREADS = [["scent", "Scent and skin", "#C58BC0", ["Samira Bello", "Jacqueleen Achilike", "Fatima Babakura", "Lù Ekeruche"], "Four people who make things you smell or put on skin, all by hand, all in Lagos. Samira's perfume oils, Jacqueleen's candles and incense, Fatima's bakhoor from Gombe, Lù's butters. None of them is a competitor to the other."], ["lagos", "Made in Lagos", "#E89A6B", ["Kike Johnson", "Omowa Temilade", "Inedoye Anikulapo-Kuti", "Tolu Oye", "Hameedah Aminu", "Tomi Mebude"], "Six labels cut and sewn here. Kike also runs a production house the others may need. Omowa and Inedoye both make beachwear. Tolu and Kike show Lagos-made womenswear the week Fashion Week opens."], ["lfw", "Fashion Week", "#8FA0E8", ["Tolu Oye", "Kike Johnson", "Hameedah Aminu", "Aylor"], "Lagos Fashion Week runs Wednesday 28 October to 1 November. Tolu, Kike and Hameedah are designers; Aylor manages the Imad Eduso brand, which shows there. Everyone at this end of the table has a busy week ahead."], ["young", "Started young", "#7FC48A", ["Samira Bello", "Fatima Babakura", "Omowa Temilade", "Dolapo Morgan"], "Fatima and Omowa both started their labels at seventeen. Samira was an Anzisha Fellow at nineteen. Dolapo is the youngest on the Ventures Platform leadership team. Dolapo's guest list, read plainly: founders who did not wait."], ["food", "Food", "#D96C6C", ["Tilly Odedina", "Tuke Morgan", "Fareedah Ade"], "Tilly runs the kitchen at FoodCourt. Tuke photographs food for her blog. Fareedah, if she is the Bloomè Fareedah, built a following on healthy cooking; confirm that first. The three people who will notice what Panu sends out."], ["modest", "North and modest", "#F0D48A", ["Hameedah Aminu", "Fatima Babakura", "Fareedah Ade"], "Inferred, not confirmed. Mulawwan is a modest-fashion label; Fatima's family is from Borno and Yerwa Secrets is named for old Maiduguri; the Bloomè Fareedah was in Marie Claire's modest-dressing piece. Hameedah takes no alcohol."], ["forbes", "F const KEY='room-in-t2';let IN={};try{IN=JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch(e){IN={}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(IN))}catch(e){}}
const SYNC_URL='/table/2/room/state';let remote=false;
function paintAll(){GUESTS.forEach(g=>{const el=faceEl[g.n];if(el)el.classList.toggle('isin',!!IN[g.id])});updateCount();const ib=sheetIn.querySelector('[data-in]');if(ib){const on=!!IN[ib.dataset.in];ib.classList.toggle('on',on);ib.setAttribute('aria-pressed',String(on));const sp=ib.querySelector('span');if(sp)sp.textContent=on?'In the room':'Mark in the room'}}
async function pull(){try{const r=await fetch(SYNC_URL,{cache:'no-store'});if(!r.ok)throw 0;const j=await r.json();IN=j.in||{};save();remote=true;paintAll()}catch(e){}}
async function push(id,on){if(!remote)return;try{await fetch(SYNC_URL,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({id,on,at:IN[id]||0})})}catch(e){}}
const byName={};GUESTS.forEach(g=>byName[g.n]=g);
const guests=GUESTS.filter(g=>!g.us);

function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function initials(n){return n.split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase()}
function pf(g,big){const src=big?(g.imgL||g.img):g.img;return `<div class="pf${g.logo?' logo':''}">${src?`<img src="${src}" alt="">`:esc(initials(g.n))}</div>`}

const TABLE_NAME={};
const W=400,R=36,ROW=92,TOP=44,XA=96,XB=304,N=14;
const H=TOP+N*ROW+30;
const pos={};GUESTS.forEach(g=>{if(g.seat){pos[g.n]={x:g.side==='A'?XA:XB,y:TOP+(g.seat-1)*ROW+ROW/2}}});
function edgePath(a,b){const p=pos[a],q=pos[b];if(!p||!q)return null;if(p.x!==q.x)return `M${p.x} ${p.y}L${q.x} ${q.y}`;const d=Math.abs(p.y-q.y)/ROW;const bulge=(p.x===XA?-1:1)*(48+d*10);const cx=p.x+bulge,cy=(p.y+q.y)/2;return `M${p.x} ${p.y}Q${cx} ${cy} ${q.x} ${q.y}`}
function edgeMid(a,b){const p=pos[a],q=pos[b];if(p.x!==q.x)return {x:(p.x+q.x)/2,y:(p.y+q.y)/2};const d=Math.abs(p.y-q.y)/ROW;const bulge=(p.x===XA?-1:1)*(48+d*10);return {x:p.x+bulge*0.72,y:(p.y+q.y)/2}}

const svg=document.getElementById('svg');
svg.setAttribute('viewBox',`0 0 ${W} ${H}`);
let s='<defs>'+GUESTS.map((g,i)=>`<clipPath id="c${i}"><circle cx="0" cy="0" r="${R}"/></clipPath>`).join('')+'</defs>';
s+=`<rect class="linen" x="166" y="${TOP-10}" width="68" height="${N*ROW+20}" rx="8"/>`;
s+=`<text class="tname" x="200" y="${TOP+N*ROW/2}">TABLE No 2</text>`;
s+=`<text class="ends" x="200" y="${TOP-22}" text-anchor="middle">DOOR</text>`;
s+=`<text class="ends" x="200" y="${TOP+N*ROW+24}" text-anchor="middle">FAR END</text>`;
s+='<g id="edges">'+EDGES.map((e,i)=>{const d=edgePath(e[0],e[1]);return d?`<path class="edge" data-i="${i}" d="${d}"/>`:''}).join('')+'</g>';
s+='<g id="faces">'+GUESTS.map((g,i)=>{const p=pos[g.n];if(!p)return '';const codeX=g.side==='A'?-(R+5):(R+5);const anchor=g.side==='A'?'end':'start';
  const img=g.img?`<image href="${g.img}" x="${-R}" y="${-R}" width="${2*R}" height="${2*R}" clip-path="url(#c${i})" preserveAspectRatio="xMidYMid ${g.logo?'meet':'slice'}"/>`:`<circle r="${R}" fill="#2E2721"/><text class="initial" y="7">${esc(initials(g.n))}</text>`;
  return `<g class="face${g.us?' us':''}${IN[g.id]?' isin':''}" data-n="${esc(g.n)}" transform="translate(${p.x} ${p.y})">${g.logo?`<circle r="${R}" fill="#fff"/>`:''}${img}<circle class="ring" r="${R+1.5}"/><circle class="in" cx="${R-8}" cy="${-R+8}" r="6"/><text class="seatcode" x="${codeX}" y="4" text-anchor="${anchor}">${g.side}${g.seat}</text><text class="nm${g.us?' us':''}" y="${R+13}">${esc(TABLE_NAME[g.n]||SHORT[g.n]||g.n)}</text><circle class="hit" r="${R+10}"/></g>`}).join('')+'</g>';
s+='<g id="labels"></g>';
svg.innerHTML=s;

const stage=document.getElementById('stage');

const faceEl={};[...svg.querySelectorAll('g.face')].forEach(el=>faceEl[el.dataset.n]=el);

function clearLit(){Object.values(faceEl).forEach(el=>{el.classList.remove('sel','lit');el.style.removeProperty('--hl')});edgeEl.forEach(el=>{el.classList.remove('lit');el.style.removeProperty('--hl')});document.getElementById('labels').innerHTML='';stage.classList.remove('focus')}
function edgesOf(n){return EDGES.map((e,i)=>({e,i})).filter(x=>x.e[0]===n||x.e[1]===n)}
function colorOf(e){return e[4]?TH[e[4]][2]:'#E8C37A'}
function lightPerson(n){clearLit();stage.classList.add('focus');faceEl[n]&&faceEl[n].classList.add('sel');const es=edgesOf(n);const lb=[];
  es.forEach(({e,i})=>{const other=e[0]===n?e[1]:e[0];const c=colorOf(e);const f=faceEl[other];if(f){f.classList.add('lit');f.style.setProperty('--hl',c)}const p=edgeEl.find(x=>+x.dataset.i===i);if(p){p.classList.add('lit');p.style.setProperty('--hl',c)}if(pos[other]&&pos[n]&&es.length<=9){const m=edgeMid(n,other);lb.push({m,t:e[2],c,i})}});
  document.getElementById('labels').innerHTML=lb.map(({m,t,c,i})=>{const w=t.length*6.2+16;return `<g class="lbl" style="--hl:${c}" data-i="${i}" transform="translate(${m.x} ${m.y})"><rect class="hit" x="${-w/2-10}" y="-17" width="${w+20}" height="34"/><rect x="${-w/2}" y="-9" width="${w}" height="18"/><text>${esc(t)}</text></g>`}).join('')}
function lightThread(id){clearLit();stage.classList.add('focus');const t=TH[id];t[3].forEach(n=>{const f=faceEl[n];if(f){f.classList.add('lit');f.style.setProperty('--hl',t[2])}});
  EDGES.forEach((e,i)=>{if(e[4]===id||(!e[4]&&t[3].includes(e[0])&&t[3].includes(e[1]))){const p=edgeEl.find(x=>+x.dataset.i===i);if(p){p.classList.add('lit');p.style.setProperty('--hl',t[2])}}})}

const sheet=document.getElementById('sheet'),sheetIn=document.getElementById('sheetIn');
function openSheet(html,focusName){sheetIn.innerHTML=html;sheet.classList.add('open');sheet.scrollTop=0;if(focusName&&faceEl[focusName]){const r=faceEl[focusName].getBoundingClientRect();const target=window.innerHeight*0.18;window.scrollBy({top:r.top-target,behavior:'smooth'})}}
function closeSheet(){sel=null;selT=null;sheet.classList.remove('open');tstrip.querySelectorAll('.tchip').forEach(b=>b.setAttribute('aria-pressed','false'))}
function closeCard(){if(sel){const n=sel;closeSheet();peek=n}else closeAll()}
function closeAll(){peek=null;closeSheet();clearLit();tstrip.querySelectorAll('.tchip').forEach(b=>b.setAttribute('aria-pressed','false'))}
function showPerson(n){const g=byName[n];sel=n;selT=null;peek=n;tstrip.querySelectorAll('.tchip').forEach(b=>b.setAttribute('aria-pressed','false'));lightPerson(n);
  const isIn=!!IN[g.id];const es=edgesOf(n);const threads=THREADS.filter(t=>t[3].includes(n));
  const bringName=g.bringTo?byName[g.bringTo]:null;const bfirst=g.bring?g.bring.split('.')[0]:'';const brest=g.bring?g.bring.split('.').slice(1).join('.').trim():'';
  const html=`<button class="close" type="button" data-close aria-label="Close">×</button><div class="grab"></div>
  <div class="hero">${pf(g,true)}<div><h2>${esc(g.n)}${g.seat?`<small>${g.side}${g.seat}</small>`:''}</h2>${g.sub?`<div class="sub">${esc(g.sub)}</div>`:''}</div><div class="who">${esc(g.who)}</div>
  ${g.us?'':`<button class="inbtn${isIn?' on':''}" type="button" data-in="${g.id}" aria-pressed="${isIn}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5l5 5L20 6.5"/></svg><span>${isIn?'In the room':'Mark in the room'}</span></button>`}</div>
  ${g.diet?`<div class="flag diet">${esc(g.diet)}</div>`:''}
  ${g.unsure?`<div class="flag">${esc(g.unsure)}</div>`:''}
  ${g.bring?`<div class="k">While standing, bring to</div><div class="bring">${bringName?pf(bringName):''}<div><b>${esc(bfirst)}</b>${brest?`<span>${esc(brest)}</span>`:''}</div></div>`:''}
  ${threads.length?`<div class="k">Threads</div><div class="tchips">${threads.map(t=>`<button class="tchip" type="button" data-t="${t[0]}" aria-pressed="false" style="--c:${t[2]}"><i></i>${esc(t[1])}</button>`).join('')}</div>`:''}
  ${es.length?`<div class="k">Connected to</div><div class="people">${es.map(({e,i})=>{const o=byName[e[0]===n?e[1]:e[0]];return `<button class="prow" type="button" data-e="${i}" style="--c:${colorOf(e)}">${pf(o)}<div class="t"><b>${esc(o.n)}</b><span>${esc(e[2])}</span><em>${esc(e[3])}</em></div></button>`}).join('')}</div>`:''}
  ${(KNOW[n]||[]).length?`<div class="k">Worth knowing</div><ul class="know">${KNOW[n].map(l=>`<li>${esc(l)}</li>`).join('')}</ul>`:''}`;
  openSheet(html,n)}
function showThread(id){const t=TH[id];selT=id;sel=null;peek=null;tstrip.querySelectorAll('.tchip').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.t===id)));lightThread(id);
  const html=`<button class="close" type="button" data-close aria-label="Close">×</button><div class="grab"></div>
  <div class="sh" style="padding-left:44px"><div style="width:14px;height:14px;border-radius:50%;background:${t[2]};box-shadow:0 0 12px ${t[2]};flex:none"></div><h2>${esc(t[1])}</h2></div>
  <div class="tline">${esc(t[4])}</div>
  <div class="members" style="--c:${t[2]}">${t[3].map(n=>{const g=byName[n];return `<button type="button" data-p="${esc(n)}">${pf(g)}<span>${esc(SHORT[n]||n)}</span></button>`}).join('')}</div>`;
  openSheet(html)}

function applySearch(){if(!q){stage.classList.remove('dimmed');Object.values(faceEl).forEach(el=>el.classList.remove('off'));return}stage.classList.add('dimmed');GUESTS.forEach(g=>{const el=faceEl[g.n];if(!el)return;const t=(g.n+' '+(g.sub||'')+' '+g.who+' '+g.side+g.seat).toLowerCase();el.classList.toggle('off',!t.includes(q))})}
document.getElementById('q').addEventListener('input',e=>{q=e.target.value.trim().toLowerCase();if(sel||selT||peek)closeAll();applySearch()});

svg.addEventListener('click',e=>{const l=e.target.closest('g.lbl');if(l){const ed=EDGES[+l.dataset.i];if(ed[4]){showThread(ed[4])}else{const who=peek||sel||ed[0];showPerson(who);const row=sheetIn.querySelector(`.prow[data-e="${l.dataset.i}"]`);if(row){row.classList.add('on');setTimeout(()=>row.scrollIntoView({block:'center',behavior:'smooth'}),350)}}return}const f=e.target.closest('g.face');if(!f){if(sel||selT||peek)closeAll();return}const n=f.dataset.n;if(sel===n){closeSheet();peek=n;return}if(peek===n){showPerson(n);return}closeSheet();peek=n;lightPerson(n);const r=f.getBoundingClientRect();const target=window.innerHeight*0.42;if(Math.abs(r.top-target)>window.innerHeight*0.25)window.scrollBy({top:r.top-target,behavior:'smooth'});hint()});
tstrip.addEventListener('click',e=>{const b=e.target.closest('.tchip');if(!b)return;if(selT===b.dataset.t){closeAll();return}showThread(b.dataset.t)});
sheetIn.addEventListener('click',e=>{
  if(e.target.closest('[data-close]')){closeCard();return}
  const tb=e.target.closest('.tchip');if(tb){showThread(tb.dataset.t);return}
  const pb=e.target.closest('[data-p]');if(pb){showPerson(pb.dataset.p);return}
  const ib=e.target.closest('[data-in]');if(ib){const id=ib.dataset.in;const on=!IN[id];if(on)IN[id]=Date.now();else delete IN[id];save();push(id,on);ib.classList.toggle('on',!!IN[id]);ib.setAttribute('aria-pressed',String(!!IN[id]));const sp=ib.querySelector('span');if(sp)sp.textContent=IN[id]?'In the room':'Mark in the room';const g=GUESTS.find(x=>x.id===id);faceEl[g.n].classList.toggle('isin',!!IN[id]);updateCount();return}
  const pr=e.target.closest('.prow');if(pr){const on=pr.classList.contains('on');sheetIn.querySelectorAll('.prow').forEach(x=>x.classList.remove('on'));if(!on)pr.classList.add('on');return}
});
let ty=null,tdy=0,tdrag=false;
sheet.addEventListener('touchstart',e=>{ty=e.touches[0].clientY;tdy=0;tdrag=false},{passive:true});
sheet.addEventListener('touchmove',e=>{if(ty==null)return;const dy=e.touches[0].clientY-ty;if(!tdrag){if(dy>8&&sheet.scrollTop<=0){tdrag=true;sheet.style.transition='none'}else if(dy<-8||sheet.scrollTop>0){ty=null;return}}if(tdrag){tdy=dy;sheet.style.transform=`translateY(${Math.max(0,dy)}px)`;if(e.cancelable)e.preventDefault()}},{passive:false});
sheet.addEventListener('touchend',()=>{sheet.style.transition='';sheet.style.transform='';if(tdrag&&tdy>90)closeCard();ty=null;tdrag=false;tdy=0});
sheet.addEventListener('touchcancel',()=>{sheet.style.transition='';sheet.style.transform='';ty=null;tdrag=false;tdy=0});
document.getElementById('reset').addEventListener('click',()=>{const ids=Object.keys(IN);IN={};save();ids.forEach(id=>push(id,false));Object.values(faceEl).forEach(el=>el.classList.remove('isin'));updateCount();if(sel)showPerson(sel)});
document.getElementById('copy').addEventListener('click',async()=>{const inn=guests.filter(g=>IN[g.id]).sort((a,b)=>IN[a.id]-IN[b.id]).map(g=>g.n);const out=guests.filter(g=>!IN[g.id]).map(g=>g.n);const txt=`In the room ${inn.length}/${guests.length}: ${inn.join(', ')||'nobody yet'}.\nStill to come: ${out.join(', ')||'nobody'}.`;const b=document.getElementById('copy');try{await navigator.clipboard.writeText(txt);b.textContent='Copied';b.classList.add('done')}catch(e){window.prompt('Copy this',txt)}setTimeout(()=>{b.textContent="Copy who's in";b.classList.remove('done')},1600)});
let hinted=false;try{hinted=!!localStorage.getItem('room-hint')}catch(e){}
function hint(){if(hinted)return;hinted=true;try{localStorage.setItem('room-hint','1')}catch(e){}const t=document.createElement('div');t.className='toast';t.textContent='Tap again for the card';document.body.appendChild(t);requestAnimationFrame(()=>t.classList.add('on'));setTimeout(()=>{t.classList.remove('on');setTimeout(()=>t.remove(),400)},2600)}
function updateCount(){document.getElementById('cin').textContent=guests.filter(g=>IN[g.id]).length;document.getElementById('ctot').textContent=guests.length}
updateCount();
pull();setInterval(()=>{if(document.visibilityState==='visible')pull()},8000);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')pull()});

</script>

</body>
