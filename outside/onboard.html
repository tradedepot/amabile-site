<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Andiamo! Onboard</title>
<meta name="robots" content="noindex">
<meta name="description" content="Add stores to Andiamo from your phone.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Andiamo!">
<meta property="og:title" content="Andiamo! Onboard">
<meta property="og:description" content="Add stores to Andiamo from your phone.">
<meta property="og:url" content="https://andiamo.ng/onboard">
<meta property="og:image" content="https://andiamo.ng/outside/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#E74529">
<link rel="icon" href="/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
/* One phone-width column: a red header with who's signed in, then one screen at a time. */
:root { --red:#E74529; --red-2:#C8371D; --ink:#2B1E17; --ink-2:#6E5D50; --ink-3:#9C8B7D; --bg:#F6F1EA; --card:#fff; --line:#ECE2D5; --line-2:#F3ECE2;
  --ok:#2E7D4F; --ok-soft:#E3F2E8; --gold:#8A5A00; --gold-soft:#FBEFD3; --warn-soft:#FBE7E4;
  --serif:"DM Serif Display",Georgia,serif; --sans:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif; }
* { box-sizing:border-box; }
html, body { margin:0; }
body { background:var(--bg); color:var(--ink); font-family:var(--sans); font-size:15.5px; line-height:1.45; -webkit-font-smoothing:antialiased; }
.top { background:var(--red); color:#fff; padding:max(12px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 14px max(16px, env(safe-area-inset-left)); border-bottom:2.5px solid var(--ink); }
.top .in { max-width:560px; margin:0 auto; display:flex; align-items:center; justify-content:space-between; gap:12px; }
.brand { display:inline-block; background:#fff; color:var(--red); border:2.5px solid var(--ink); border-radius:12px; padding:4px 10px 5px; line-height:1; box-shadow:0 3px 0 rgba(43,30,23,.3); text-decoration:none; }
.brand b { font-family:var(--serif); font-weight:400; font-size:19px; display:block; }
.brand small { display:block; font-size:8px; font-weight:900; letter-spacing:1.1px; text-transform:uppercase; margin-top:2px; }
.who { position:relative; }
.me { display:flex; align-items:center; gap:8px; background:rgba(255,255,255,.14); border:1.5px solid rgba(255,255,255,.4); color:#fff; border-radius:999px; padding:4px 10px 4px 4px; font:inherit; font-weight:900; font-size:14px; cursor:pointer; }
.me i { font-style:normal; width:32px; height:32px; border-radius:50%; background:#fff; color:var(--red); border:2px solid var(--ink); display:grid; place-items:center; font-size:13px; font-weight:900; }
.me svg { width:12px; height:12px; opacity:.85; }
.menu { position:absolute; right:0; top:calc(100% + 8px); background:var(--card); color:var(--ink); border:2px solid var(--ink); border-radius:14px; box-shadow:0 4px 0 var(--ink); padding:6px; min-width:170px; z-index:5; }
.menu p { margin:0; padding:8px 10px 6px; font-size:12.5px; font-weight:700; color:var(--ink-2); }
.menu button { display:block; width:100%; text-align:left; background:none; border:0; border-radius:10px; padding:9px 10px; font:inherit; font-weight:900; font-size:14.5px; color:var(--red-2); cursor:pointer; }
.menu a { display:block; padding:9px 10px; border-radius:10px; font-weight:900; font-size:14.5px; color:var(--ink); text-decoration:none; }
.menu button:hover, .menu a:hover { background:var(--line-2); }
.whoold {  background:transparent; border:1px solid rgba(255,255,255,.45); color:#fff; border-radius:999px; padding:3px 10px; font:inherit; font-size:12px; font-weight:800; cursor:pointer; }
main { max-width:560px; margin:0 auto; padding:20px max(16px, env(safe-area-inset-right)) 48px max(16px, env(safe-area-inset-left)); }
h1 { font-family:var(--serif); font-weight:400; font-size:30px; line-height:1.08; margin:0 0 6px; text-wrap:balance; }
.sub { color:var(--ink-2); font-weight:700; margin:0 0 18px; }
.panel { background:var(--card); border:1px solid var(--line); border-radius:18px; padding:4px 16px 18px; box-shadow:0 1px 2px rgba(43,30,23,.05); }
.sec { padding-top:14px; }
.sec + .sec { border-top:1px solid var(--line-2); margin-top:14px; }
.sec h2 { font-size:11.5px; font-weight:900; letter-spacing:1.2px; text-transform:uppercase; color:var(--ink-3); margin:0 0 2px; }
.sec .hint { font-size:13px; color:var(--ink-2); font-weight:700; margin:2px 0 0; }
label { display:block; font-weight:800; font-size:13.5px; margin:12px 0 6px; }
label small { font-weight:600; color:var(--ink-3); }
input, select { width:100%; font:inherit; font-size:16px; color:var(--ink); padding:12px 14px; border:1.5px solid var(--line); border-radius:12px; background:#fff; }
input:focus, select:focus { outline:none; border-color:var(--red); box-shadow:0 0 0 4px rgba(231,69,41,.12); }
.row { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.row > * { min-width:0; }
.kinds { display:flex; flex-wrap:wrap; gap:6px; }
.kinds button { border:1.5px solid var(--line); background:#fff; border-radius:999px; padding:7px 13px; font:inherit; font-size:14px; font-weight:800; color:var(--ink-2); cursor:pointer; }
.kinds button.on { border-color:var(--red); background:#FDECE7; color:var(--ink); }
.money { position:relative; } .money input { padding-left:28px; } .money::before { content:"₦"; position:absolute; left:12px; top:50%; transform:translateY(-50%); font-weight:800; color:var(--ink-3); }
.btn { display:block; width:100%; margin-top:16px; padding:14px; border:0; border-radius:999px; background:var(--red); color:#fff; font:inherit; font-weight:900; font-size:16px; box-shadow:0 3px 0 var(--red-2); cursor:pointer; text-align:center; text-decoration:none; }
.btn:disabled { opacity:.55; cursor:default; }
.btn.ghost { background:#fff; color:var(--ink); border:1.5px solid var(--line); box-shadow:none; }
.btn.sm { display:inline-block; width:auto; margin:0; padding:8px 14px; font-size:14px; }
.loc { display:flex; align-items:center; gap:10px; margin-top:10px; }
.loc .btn { margin:0; flex:none; width:auto; padding:10px 16px; font-size:14.5px; }
.loc .st { font-size:13.5px; font-weight:800; color:var(--ink-2); }
.loc .st.ok { color:var(--ok); }
.acct { margin-top:10px; border-radius:12px; padding:10px 12px; font-weight:800; font-size:14px; }
.acct.ok { background:var(--ok-soft); color:var(--ok); }
.acct.no { background:var(--gold-soft); color:var(--gold); }
.acct small { display:block; font-weight:700; color:var(--ink-2); margin-top:2px; }
.photo { display:flex; align-items:center; gap:12px; margin-top:8px; }
.photo img { width:64px; height:64px; object-fit:cover; border-radius:10px; border:1px solid var(--line); }
.chk { display:flex; gap:10px; align-items:center; font-weight:800; font-size:14px; margin-top:12px; }
.chk input { width:20px; height:20px; accent-color:var(--red); }
.hi { margin:0 0 2px; font-weight:800; color:var(--ink-2); }
.tiles { display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:8px; margin:14px 0 4px; }
.tile { background:var(--card); border:2px solid var(--ink); border-radius:16px; padding:10px 12px; }
.tile b { display:block; font-family:var(--serif); font-weight:400; font-size:30px; line-height:1; }
.tile span { font-size:12px; font-weight:900; letter-spacing:.6px; text-transform:uppercase; color:var(--ink-2); }
.tile.live b { color:var(--ok); } .tile.wait b { color:var(--gold); } .tile.back b { color:var(--ink-3); }
.tile.back.hot { background:var(--red); border-color:var(--ink); } .tile.back.hot b, .tile.back.hot span { color:#fff; }
.cta { display:flex; align-items:center; gap:14px; width:100%; margin-top:16px; padding:14px 16px; background:var(--red); color:#fff; border:2.5px solid var(--ink); border-radius:20px; box-shadow:0 4px 0 var(--ink); font:inherit; text-align:left; cursor:pointer; }
.cta:active { transform:translateY(3px); box-shadow:0 1px 0 var(--ink); }
.cta .plus { width:40px; height:40px; flex:none; border-radius:12px; background:#fff; color:var(--red); border:2px solid var(--ink); display:grid; place-items:center; font-size:26px; font-weight:900; line-height:1; }
.cta b { display:block; font-size:18px; font-weight:900; }
.cta small { display:block; font-size:13px; font-weight:700; opacity:.9; }
.guide { display:block; text-align:center; margin-top:12px; font-weight:800; font-size:14px; color:var(--red-2); }
.sh { display:flex; align-items:center; gap:8px; margin:28px 0 6px; }
.sh h2 { font-family:var(--serif); font-weight:400; font-size:24px; margin:0; }
.count { background:var(--ink); color:#fff; border-radius:999px; font-size:12px; font-weight:900; padding:2px 9px; }
.shsub { margin:0 0 10px; color:var(--ink-2); font-weight:700; font-size:14px; }
.cards { display:flex; flex-direction:column; gap:10px; }
.ask, .store { background:var(--card); border:2px solid var(--ink); border-radius:16px; padding:12px; display:grid; gap:10px; align-items:center; box-shadow:0 3px 0 var(--ink); }
.ask { grid-template-columns:44px minmax(0,1fr) auto; }
.ask .av { width:44px; height:44px; border-radius:12px; background:var(--gold-soft); color:var(--gold); border:2px solid var(--ink); display:grid; place-items:center; font-family:var(--serif); font-size:22px; }
.info { min-width:0; }
.info b { display:block; font-weight:900; font-size:16px; line-height:1.2; overflow-wrap:anywhere; }
.info span { display:block; font-size:13px; color:var(--ink-2); font-weight:700; }
.info em { display:inline-block; margin-top:4px; font-style:normal; font-size:11.5px; font-weight:900; color:var(--ok); background:var(--ok-soft); border-radius:999px; padding:1px 8px; }
.acts { display:flex; gap:6px; align-items:center; }
.wa { width:40px; height:40px; border-radius:50%; background:#25D366; color:#fff; border:2px solid var(--ink); display:grid; place-items:center; }
.wa svg { width:22px; height:22px; }
.add { border:2px solid var(--ink); background:var(--red); color:#fff; border-radius:999px; padding:8px 14px; font:inherit; font-weight:900; font-size:14px; cursor:pointer; box-shadow:0 2px 0 var(--ink); white-space:nowrap; }
.store { grid-template-columns:minmax(0,1fr) auto; border-left-width:7px; }
.store.live { border-left-color:var(--ok); } .store.wait { border-left-color:var(--gold); } .store.back { border-left-color:var(--red); } .store.off { border-left-color:var(--ink-3); opacity:.75; }
.fixbox { grid-column:1 / -1; display:flex; gap:10px; align-items:center; justify-content:space-between; background:var(--warn-soft); border-radius:12px; padding:10px 12px; }
.fixbox p { margin:0; color:var(--red-2); font-weight:800; font-size:13.5px; }
.pill { border-radius:999px; padding:3px 10px; font-size:12px; font-weight:900; white-space:nowrap; }
.pill.wait { background:var(--gold-soft); color:var(--gold); } .pill.live { background:var(--ok-soft); color:var(--ok); }
.pill.back { background:var(--warn-soft); color:var(--red-2); } .pill.off { background:var(--line-2); color:var(--ink-2); }
.empty { border:2px dashed var(--line); border-radius:16px; padding:20px; color:var(--ink-2); font-weight:700; text-align:center; }
.empty b { display:block; color:var(--ink); font-size:16px; margin-bottom:2px; }
.done { text-align:center; padding:22px 8px 6px; }
.done .tick { width:60px; height:60px; border-radius:50%; background:var(--red); color:#fff; display:flex; align-items:center; justify-content:center; margin:0 auto 14px; }
.done .tick.wait { background:var(--gold); }
.err { color:var(--red-2); font-weight:800; font-size:14px; margin-top:10px; min-height:1em; }
.bad { border-color:var(--red-2) !important; box-shadow:0 0 0 4px rgba(200,55,29,.14) !important; }
.ferr { display:flex; gap:7px; color:var(--red-2); font-weight:800; font-size:13.5px; margin:7px 2px 0; }
.ferr::before { content:"!"; flex:none; width:17px; height:17px; border-radius:50%; background:var(--red-2); color:#fff; font-size:11px; font-weight:900; display:flex; align-items:center; justify-content:center; margin-top:1px; }
.muted { color:var(--ink-2); font-size:14px; }
.dev { color:var(--ink-3); font-size:13px; }
@media (max-width:360px) { .row { grid-template-columns:1fr; } }
@media (prefers-reduced-motion: reduce) { * { scroll-behavior:auto !important; } }
</style>
</head>
<body>
<header class="top"><div class="in"><a class="brand" href="/"><b>Andiamo!</b><small>Onboard</small></a><div class="who" id="who"></div></div></header>
<main id="app"></main>
<script>
(() => {
  const API = "/api/outside-onboard", app = document.getElementById("app"), $ = (id) => document.getElementById(id);
  const LS = { get(k) { try { return localStorage.getItem(k); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} }, del(k) { try { localStorage.removeItem(k); } catch {} } };
  const esc = (x) => String(x == null ? "" : x).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  let at = LS.get("andiamo.onb") || "", S = null;
  const ERR = {
    not_onboarder: "This number isn't set up to add stores. Ask your Amabile contact.", phone: "Check the number.", slow_down: "Too many codes. Try again in a few minutes.",
    send_failed: "We couldn't send the code. Check the number is on WhatsApp.", expired: "That code has expired. Send a new one.", wrong_code: "That code isn't right.", too_many: "Too many tries. Send a new code.",
    name: "Add the store's name.", area: "Choose the area.", kind: "Choose what kind of place it is.", location: "Stand inside the store and tap Use my location.", prices: "Add the menu price of at least one wine.",
    manager_name: "Add the manager's name.", manager_phone: "Check the manager's WhatsApp number.", bar_phone: "Check the bar phone numbers.", account_number: "Account numbers have 10 digits.", bank: "Choose the bank.",
    resolve: "The bank doesn't recognise that account. Check the number and the bank.", duplicate: "You've already sent this store. It's waiting for approval.", request_taken: "Someone has already added this venue.", not_editable: "This store can't be changed now.",
    offline: "You're offline. Try again.", server: "Something went wrong. Try again."
  };
  async function api(body) {
    try { const r = await fetch(API, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ ...(at ? { at } : {}), ...body }) });
      const d = await r.json().catch(() => ({ ok: false, error: "server" }));
      if (r.status === 401 && body.action !== "verify") { signOut(); signIn(ERR.not_onboarder); throw new Error("auth"); }
      return d; } catch (e) { if (e.message === "auth") throw e; return { ok: false, error: "offline" }; }
  }
  function flag(el, text) {
    if (!el) return;
    unflag(el); el.classList.add("bad");
    const p = document.createElement("p"); p.className = "ferr"; p.setAttribute("role", "alert"); p.textContent = text; el.insertAdjacentElement("afterend", p);
    el.scrollIntoView({ block: "center", behavior: "smooth" });
    try { navigator.vibrate && navigator.vibrate(60); } catch {}
    if (el.matches("input, select")) try { el.focus({ preventScroll: true }); } catch {}
    const off = () => unflag(el); ["input", "change", "click"].forEach((e) => el.addEventListener(e, off, { once: true }));
  }
  function unflag(el) { const n = el.nextElementSibling; if (n && n.classList.contains("ferr")) n.remove(); el.classList.remove("bad"); }
  function signOut() { at = ""; S = null; LS.del("andiamo.onb"); $("who").innerHTML = ""; }
  const top = () => window.scrollTo(0, 0);

  // ---------- sign in ----------
  function signIn(msg) {
    $("who").innerHTML = "";
    app.innerHTML = `<h1>Add stores to Andiamo</h1><p class="sub">Sign in with your WhatsApp number.</p>
      <div class="panel"><div class="sec"><label for="ph">Your WhatsApp number</label><input id="ph" type="tel" inputmode="tel" autocomplete="tel" placeholder="0803 000 0000">
        <div id="cbox" hidden><label for="cd">Code from WhatsApp</label><input id="cd" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="6 digits"><p class="dev" id="dev"></p></div>
        <button class="btn" id="go">Send me a code</button><p class="err" id="err" role="alert"></p></div></div>`;
    let sent = false, busy = false;
    if (msg) $("err").textContent = msg;
    $("ph").oninput = () => { if (sent) { sent = false; $("cbox").hidden = true; $("go").textContent = "Send me a code"; } };
    const go = async () => {
      if (busy) return; $("err").textContent = "";
      const phone = $("ph").value.trim(); if (phone.replace(/\D/g, "").length < 8) return flag($("ph"), "Add your WhatsApp number.");
      busy = true; $("go").disabled = true;
      try {
        if (!sent) {
          const r = await api({ action: "start", phone }); if (!r.ok) return r.error === "not_onboarder" ? ($("err").textContent = ERR.not_onboarder) : flag($("ph"), ERR[r.error] || ERR.server);
          sent = true; $("cbox").hidden = false; $("dev").textContent = r.devCode ? "Test code: " + r.devCode : ""; $("go").textContent = "Sign in"; $("cd").focus(); return;
        }
        if ($("cd").value.replace(/\D/g, "").length < 6) return flag($("cd"), "Enter the 6-digit code from WhatsApp.");
        const r = await api({ action: "verify", phone, code: $("cd").value });
        if (!r.ok) return ["wrong_code", "expired", "too_many"].includes(r.error) ? flag($("cd"), ERR[r.error]) : ($("err").textContent = ERR[r.error] || ERR.server);
        at = r.token; LS.set("andiamo.onb", at); home();
      } finally { busy = false; $("go").disabled = false; }
    };
    $("go").onclick = go; $("cd").onkeydown = $("ph").onkeydown = (e) => { if (e.key === "Enter") go(); };
  }

  // ---------- my stores ----------
  const STAGE = { submitted: ["Waiting", "wait"], live: ["Live", "live"], sent_back: ["Needs a fix", "back"], declined: ["Not taken", "off"], listed: ["Approved", "live"] };
  async function load() { const r = await api({ action: "me" }); if (!r.ok) { signIn(ERR[r.error]); return null; } S = r; return r; }
  async function home(flash) {
    const r = await load(); if (!r) return;
    const nm = String(r.me.name || "?").trim(), ws = nm.split(/\s+/);
    const ini = (ws.length > 1 ? ws[0][0] + ws[1][0] : /^[A-Z]{2,3}$/.test(nm) ? nm : nm[0]).toUpperCase();
    $("who").innerHTML = `<button class="me" id="me" aria-haspopup="true" aria-expanded="false"><i>${esc(ini)}</i>${esc(r.me.name)}<svg viewBox="0 0 12 8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M1 1.5l5 5 5-5"/></svg></button>
      <div class="menu" id="menu" hidden><a href="/onboard/guide">How it works</a><button id="out">Sign out</button></div>`;
    $("me").onclick = (e) => { e.stopPropagation(); const m = $("menu"); m.hidden = !m.hidden; $("me").setAttribute("aria-expanded", String(!m.hidden)); };
    document.onclick = () => { const m = $("menu"); if (m) m.hidden = true; };
    $("out").onclick = () => { signOut(); signIn(); };
    const n = (st) => r.stores.filter((x) => x.stage === st).length;
    const asked = r.asked || [];
    const ago = (t) => { const d = Math.floor((Date.now() - t) / 864e5); return d < 1 ? "today" : d === 1 ? "yesterday" : d + " days ago"; };
    const WA = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm5.5 14.1c-.2.7-1.3 1.3-1.8 1.3-.5.1-1 .2-3.3-.7-2.8-1.1-4.6-3.9-4.7-4.1-.1-.2-1.1-1.5-1.1-2.9s.7-2 1-2.3c.3-.3.6-.3.8-.3h.6c.2 0 .4 0 .6.5l.9 2.1c.1.2.1.4 0 .6l-.4.6-.4.5c-.1.2-.3.3-.1.6.2.3.8 1.3 1.7 2.1 1.2 1 2.1 1.4 2.4 1.5.3.1.5.1.7-.1l.9-1.1c.2-.3.4-.2.7-.1l2 1c.3.1.5.2.6.3.1.2.1.8-.2 1.4z"/></svg>';
    const tiles = r.stores.length ? `<div class="tiles"><div class="tile live"><b>${n("live")}</b><span>Live</span></div><div class="tile wait"><b>${n("submitted")}</b><span>Waiting</span></div><div class="tile back${n("sent_back") ? " hot" : ""}"><b>${n("sent_back")}</b><span>Needs a fix</span></div></div>` : "";
    const order = { sent_back: 0, submitted: 1, live: 2, declined: 3 };
    const stores = r.stores.slice().sort((x, y) => (order[x.stage] ?? 9) - (order[y.stage] ?? 9));
    app.innerHTML = (flash || "") + `<h1>Your stores</h1>${tiles}
      <button class="cta" id="add"><span class="plus">+</span><span><b>Add a store</b><small>Standing in it. About three minutes.</small></span></button>
      <a class="guide" href="/onboard/guide">New to this? Read the guide</a>
      ${asked.length ? `<div class="sh"><h2>Asked to join</h2><span class="count">${asked.length}</span></div><p class="shsub">They signed up themselves. Message the manager, go, then add it from inside.</p>
        <div class="cards">${asked.map((q) => `<div class="ask"><div class="av">${esc((q.name || "?").trim().charAt(0).toUpperCase())}</div>
          <div class="info"><b>${esc(q.name)}</b><span>${esc(q.area)} · ${esc(q.contactName)} · ${ago(q.createdAt)}</span>${q.stocksAmabile === "yes" ? '<em>Sells Amabile</em>' : ""}</div>
          <div class="acts"><a class="wa" href="https://wa.me/${esc(String(q.phone || "").replace(/\D/g, ""))}" target="_blank" rel="noopener" aria-label="WhatsApp ${esc(q.contactName)}">${WA}</a><button class="add" data-from="${esc(q.id)}">Add it</button></div></div>`).join("")}</div>` : ""}
      <div class="sh"><h2>${asked.length ? "Yours" : "Your list"}</h2>${r.stores.length ? `<span class="count">${r.stores.length}</span>` : ""}</div>
      ${stores.length ? `<div class="cards">${stores.map((x) => { const [t, c] = STAGE[x.stage] || ["Waiting", "wait"]; return `<div class="store ${c}"><div class="info"><b>${esc(x.name)}</b><span>${esc(x.area)} · ${ago(x.createdAt)}</span></div><span class="pill ${c}">${t}</span>
        ${x.stage === "sent_back" ? `<div class="fixbox"><p>${esc(x.returnNote)}</p><button class="add" data-fix="${esc(x.id)}">Fix it</button></div>` : ""}</div>`; }).join("")}</div>`
        : `<div class="empty"><b>Nothing yet</b>Your first store shows here once you send it.</div>`}`;
    $("add").onclick = () => form({});
    app.querySelectorAll("[data-from]").forEach((b) => (b.onclick = () => { const q = asked.find((y) => y.id === b.dataset.from); form({ fromRequest: q.id, name: q.name, area: q.area, managerName: q.contactName, managerPhone: q.phone }); }));
    app.querySelectorAll("[data-fix]").forEach((b) => (b.onclick = () => { const x = r.stores.find((y) => y.id === b.dataset.fix); form({ ...x.store, id: x.id, account: "", bankCode: (x.store.payout || {}).bankCode || "" }); }));
    top();
  }

  // ---------- add a store ----------
  let banks = null;
  async function form(pre) {
    if (!banks) { const b = await api({ action: "banks" }); banks = b.ok ? b.banks : []; }
    const st = { kind: pre.kind || "", lat: pre.lat ?? null, lng: pre.lng ?? null, acc: pre.acc || 0, photo: null, acct: null };
    const W = S.wines;
    app.innerHTML = `<button class="btn sm ghost" id="back" style="margin-bottom:14px">← Your stores</button>
      <h1>${pre.id ? "Fix " + esc(pre.name) : "Add a store"}</h1><p class="sub">${S.me.auto ? "It goes live as soon as you send it." : "Amabile checks it, then it goes live."}</p>
      <div class="panel">
        <div class="sec"><h2>The store</h2>
          <label for="nm">Store name</label><input id="nm" maxlength="60" value="${esc(pre.name || "")}" autocomplete="off">
          <label for="ar">Area</label><select id="ar"><option value="">Choose the area</option>${S.areas.map((a) => `<option${pre.area === a ? " selected" : ""}>${esc(a)}</option>`).join("")}</select>
          <label>What kind of place</label><div class="kinds" id="kd">${S.kinds.map(([k, n]) => `<button type="button" data-k="${k}" class="${st.kind === k ? "on" : ""}">${n}</button>`).join("")}</div></div>
        <div class="sec"><h2>Where it is</h2><p class="hint">Stand inside, in the main room.</p>
          <div class="loc"><button class="btn ghost" id="here" type="button">Use my location</button><span class="st" id="lst">${st.lat != null ? "Location saved" : "Not set yet"}</span></div></div>
        <div class="sec"><h2>Menu prices</h2><p class="hint">What a bottle costs on their menu. Leave blank what they don't sell.</p>
          <div class="row">${W.map((w) => `<div><label for="p-${w.id}">${esc(w.name)}</label><div class="money"><input id="p-${w.id}" inputmode="numeric" value="${esc((pre.prices || {})[w.id] || "")}"></div></div>`).join("")}</div>
          <label class="chk"><input type="checkbox" id="tx"${pre.taxIncluded ? " checked" : ""}> Prices include VAT and service</label>
          <label>Photo of the menu <small>optional</small></label><div class="photo"><input type="file" id="ph" accept="image/*" capture="environment"><img id="pv" alt="" hidden></div></div>
        <div class="sec"><h2>The manager</h2><p class="hint">They sign in to the bar phone with this number.</p>
          <div class="row"><div><label for="mn">Name</label><input id="mn" maxlength="30" value="${esc(pre.managerName || "")}"></div>
          <div><label for="mp">WhatsApp number</label><input id="mp" type="tel" inputmode="tel" value="${esc(pre.managerPhone || "")}" placeholder="0803 000 0000"></div></div>
          <label for="bp">Other bar phone numbers <small>optional</small></label><input id="bp" type="tel" inputmode="tel" value="${esc((pre.barPhones || []).join(", "))}" placeholder="Separate with commas"></div>
        <div class="sec"><h2>Where we pay them</h2><p class="hint">The store's own bank account. We pay its menu price for every bottle served.</p>
          <label for="bk">Bank <small>optional for now</small></label><select id="bk"><option value="">Choose the bank</option>${banks.map((b) => `<option value="${esc(b.code)}"${pre.bankCode === b.code ? " selected" : ""}>${esc(b.name)}</option>`).join("")}</select>
          <label for="ac">Account number</label><input id="ac" inputmode="numeric" maxlength="10" placeholder="10 digits">
          <div id="an"></div></div>
        <button class="btn" id="send">${S.me.auto ? "Put it live" : "Send for approval"}</button><p class="err" id="err" role="alert"></p>
      </div>`;
    top();
    $("back").onclick = () => home();
    app.querySelectorAll("[data-k]").forEach((b) => (b.onclick = () => { st.kind = b.dataset.k; app.querySelectorAll("[data-k]").forEach((x) => x.classList.toggle("on", x === b)); unflag($("kd")); }));
    $("here").onclick = () => {
      if (!navigator.geolocation) return flag($("here"), "This phone can't share its location.");
      $("lst").textContent = "Finding you..."; $("lst").className = "st";
      navigator.geolocation.getCurrentPosition((p) => {
        st.lat = +p.coords.latitude.toFixed(6); st.lng = +p.coords.longitude.toFixed(6); st.acc = Math.round(p.coords.accuracy);
        $("lst").className = "st ok"; $("lst").textContent = st.acc > 60 ? `Saved, to about ${st.acc} m. Move to the middle of the room and tap again.` : `Saved, to about ${st.acc} m`;
      }, () => { $("lst").textContent = "Turn on location for this site, then tap again."; }, { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 });
    };
    // A smaller copy of the menu photo, so it sends quickly on a weak signal.
    $("ph").onchange = () => {
      const f = $("ph").files[0]; if (!f) return;
      const img = new Image(), url = URL.createObjectURL(f);
      img.onload = () => { const k = Math.min(1, 1200 / Math.max(img.width, img.height)), c = document.createElement("canvas"); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); st.photo = c.toDataURL("image/jpeg", 0.7); $("pv").src = st.photo; $("pv").hidden = false; URL.revokeObjectURL(url); };
      img.src = url;
    };
    // The bank says whose account it is. If it doesn't look like the store, it waits for Amabile to check.
    const check = async () => {
      st.acct = null; $("an").innerHTML = "";
      const code = $("bk").value, acct = $("ac").value.replace(/\D/g, "");
      if (!code || acct.length !== 10) return;
      $("an").innerHTML = `<div class="acct">Checking with the bank...</div>`;
      const r = await api({ action: "resolve", bankCode: code, account: acct, storeName: $("nm").value });
      if (!r.ok) { $("an").innerHTML = ""; return flag($("ac"), ERR[r.error] || ERR.resolve); }
      st.acct = r;
      $("an").innerHTML = r.matches ? `<div class="acct ok">${esc(r.name)}<small>${esc(r.bank)}</small></div>`
        : `<div class="acct no">${esc(r.name)}<small>This name doesn't look like the store. It will wait for Amabile to check before it goes live.</small></div>`;
    };
    $("bk").onchange = check; $("ac").oninput = () => { if ($("ac").value.replace(/\D/g, "").length === 10) check(); else { st.acct = null; $("an").innerHTML = ""; } };
    $("nm").onchange = () => { if (st.acct) check(); };
    $("send").onclick = async () => {
      $("err").textContent = "";
      const prices = {}; W.forEach((w) => (prices[w.id] = $("p-" + w.id).value));
      const store = { id: pre.id || "", fromRequest: pre.fromRequest || "", name: $("nm").value.trim(), area: $("ar").value, kind: st.kind, lat: st.lat, lng: st.lng, acc: st.acc, prices, taxIncluded: $("tx").checked,
        managerName: $("mn").value.trim(), managerPhone: $("mp").value.trim(), barPhones: $("bp").value, bankCode: $("bk").value, account: $("ac").value.replace(/\D/g, ""), menuPhoto: st.photo };
      if (store.name.length < 2) return flag($("nm"), ERR.name);
      if (!store.area) return flag($("ar"), ERR.area);
      if (!store.kind) return flag($("kd"), ERR.kind);
      if (store.lat == null) return flag($("here"), ERR.location);
      if (!W.some((w) => String(prices[w.id]).replace(/\D/g, ""))) return flag($("p-" + W[0].id), ERR.prices);
      if (!store.managerName) return flag($("mn"), ERR.manager_name);
      if (store.managerPhone.replace(/\D/g, "").length < 8) return flag($("mp"), ERR.manager_phone);
      if (store.account && !store.bankCode) return flag($("bk"), ERR.bank);
      if (store.bankCode && store.account.length !== 10) return flag($("ac"), ERR.account_number);
      $("send").disabled = true;
      const r = await api({ action: "submit", store }).finally(() => { $("send").disabled = false; });
      if (!r.ok) {
        const F = { name: "nm", area: "ar", kind: "kd", location: "here", manager_name: "mn", manager_phone: "mp", bar_phone: "bp", account_number: "ac", bank: "bk", resolve: "ac" };
        return F[r.error] ? flag($(F[r.error]), ERR[r.error]) : ($("err").textContent = ERR[r.error] || ERR.server);
      }
      done(store.name, r);
    };
  }
  function done(name, r) {
    const live = r.stage === "live";
    app.innerHTML = `<div class="panel done"><div class="tick${live ? "" : " wait"}"><svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
      <h1>${live ? esc(name) + " is live" : "Sent for approval"}</h1>
      <p class="muted">${live ? "The manager gets a WhatsApp to sign in to the bar phone. Show them one bottle before you leave."
        : r.held === "name_mismatch" ? "The bank account name doesn't match the store, so Amabile will check it first. We'll WhatsApp you when it's live."
        : "Amabile checks it, then it goes live. We'll WhatsApp you when it does."}</p>
      <button class="btn" id="more">Add another store</button><button class="btn ghost" id="list">Your stores</button></div>`;
    $("more").onclick = () => form({}); $("list").onclick = () => home(); top();
  }

  if (at) home().catch(() => {}); else signIn();
})();
</script>
</body>
</html>
