<style>
/* One phone-width column: a red header with who's signed in, then one screen at a time. */
:root { --red:#E74529; --red-2:#C8371D; --ink:#2B1E17; --ink-2:#6E5D50; --ink-3:#9C8B7D; --bg:#F6F1EA; --card:#fff; --line:#ECE2D5; --line-2:#F3ECE2;
  --ok:#2E7D4F; --ok-soft:#E3F2E8; --gold:#8A5A00; --gold-soft:#FBEFD3; --warn-soft:#FBE7E4;
  --serif:"DM Serif Display",Georgia,serif; --sans:"Nunito",system-ui,-apple-system,"Segoe UI",sans-serif; }
* { box-sizing:border-box; }
html, body { margin:0; }
body { background:var(--bg); color:var(--ink); font-family:var(--sans); font-size:15.5px; line-height:1.45; -webkit-font-smoothing:antialiased; }
.top { background:var(--red); color:#fff; padding:max(12px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 14px max(16px, env(safe-area-inset-left)); border-bottom:2.5px solid var(--ink); }
.top .in { max-width:560px; margin:0 auto; display:flex; align-items:center; justify-content:space-between; gap:12px; }
.brand { display:inline-block; background:#fff; color:var(--red); border:2.5px solid var(--ink); border-radius:12px; padding:4px 10px 5px; line-height:1; box-shadow:0 3px 0 rgba(43,30,23,.3); text-decoration:none; }
.brand b { font-family:var(--serif); font-weight:400; font-size:19px; display:block; }
.brand small { display:block; font-size:8px; font-weight:900; letter-spacing:1.1px; text-transform:uppercase; margin-top:2px; }
.who { position:relative; }
.me { display:flex; align-items:center; gap:8px; background:rgba(255,255,255,.14); border:1.5px solid rgba(255,255,255,.4); color:#fff; border-radius:999px; padding:4px 10px 4px 4px; font:inherit; font-weight:900; font-size:14px; cursor:pointer; }
.me i { font-style:normal; width:32px; height:32px; border-radius:50%; background:#fff; color:var(--red); border:2px solid var(--ink); display:grid; place-items:center; font-size:13px; font-weight:900; }
.me svg { width:12px; height:12px; opacity:.85; }
.menu { position:absolute; right:0; top:calc(100% + 8px); background:var(--card); color:var(--ink); border:2px solid var(--ink); border-radius:14px; box-shadow:0 4px 0 var(--ink); padding:6px; min-width:170px; z-index:5; }
.menu p { margin:0; padding:8px 10px 6px; font-size:12.5px; font-weight:700; color:var(--ink-2); }
.menu button { display:block; width:100%; text-align:left; background:none; border:0; border-radius:10px; padding:9px 10px; font:inherit; font-weight:900; font-size:14.5px; color:var(--red-2); cursor:pointer; }
.menu a { display:block; padding:9px 10px; border-radius:10px; font-weight:900; font-size:14.5px; color:var(--ink); text-decoration:none; }
.menu button:hover, .menu a:hover { background:var(--line-2); }
.whoold {  background:transparent; border:1px solid rgba(255,255,255,.45); color:#fff; border-radius:999px; padding:3px 10px; font:inherit; font-size:12px; font-weight:800; cursor:pointer; }
main { max-width:560px; margin:0 auto; padding:20px max(16px, env(safe-area-inset-right)) 48px max(16px, env(safe-area-inset-left)); }
h1 { font-family:var(--serif); font-weight:400; font-size:30px; line-height:1.08; margin:0 0 6px; text-wrap:balance; }
.sub { color:var(--ink-2); font-weight:700; margin:0 0 18px; }
.panel { background:var(--card); border:1px solid var(--line); border-radius:18px; padding:4px 16px 18px; box-shadow:0 1px 2px rgba(43,30,23,.05); }
.sec { padding-top:14px; }
.sec + .sec { border-top:1px solid var(--line-2); margin-top:14px; }
.sec h2 { font-size:11.5px; font-weight:900; letter-spacing:1.2px; text-transform:uppercase; color:var(--ink-3); margin:0 0 2px; }
.sec .hint { font-size:13px; color:var(--ink-2); font-weight:700; margin:2px 0 0; }
label { display:block; font-weight:800; font-size:13.5px; margin:12px 0 6px; }
label small { font-weight:600; color:var(--ink-3); }
input, select { width:100%; font:inherit; font-size:16px; font-weight:700; color:var(--ink); padding:13px 14px; border:2px solid var(--line); border-radius:14px; background:#fff; transition:border-color .15s, box-shadow .15s; }
input::placeholder { color:var(--ink-3); font-weight:600; }
input:focus, select:focus { outline:none; border-color:var(--ink); box-shadow:0 3px 0 var(--ink); }
.row { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.row > * { min-width:0; }
.kinds { display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:8px; }
.kinds button { display:flex; flex-direction:column; align-items:center; gap:6px; border:2px solid var(--line); background:#fff; border-radius:14px; padding:12px 2px 10px; font:inherit; font-size:12px; font-weight:900; color:var(--ink-2); cursor:pointer; transition:border-color .15s, background .15s, color .15s; }
.kinds button svg { width:24px; height:24px; }
.kinds button.on { border-color:var(--ink); background:var(--red); color:#fff; box-shadow:0 3px 0 var(--ink); }
.kinds.bad { border-radius:14px; box-shadow:0 0 0 3px rgba(200,55,29,.25) !important; }
/* the add-a-store form: one card per step */
.blk { background:var(--card); border:2px solid var(--ink); border-radius:20px; box-shadow:0 4px 0 var(--ink); padding:16px 16px 18px; margin-top:14px; }
.blk header { display:flex; gap:12px; align-items:flex-start; margin-bottom:4px; }
.blk header .n { flex:none; width:28px; height:28px; border-radius:50%; background:var(--ink); color:#fff; display:grid; place-items:center; font-weight:900; font-size:13.5px; margin-top:1px; }
.blk header h2 { font-family:var(--serif); font-weight:400; font-size:23px; line-height:1.1; margin:0; }
.blk header p { margin:3px 0 0; font-size:13.5px; font-weight:700; color:var(--ink-2); }
.blk > label:first-of-type, #sfields > label:first-child { margin-top:14px; }
.lnk { background:none; border:0; padding:8px 0 0; font:inherit; font-weight:900; font-size:14px; color:var(--red-2); cursor:pointer; }
.fgroup { margin-top:14px; border:2px solid var(--line); border-radius:16px; background:#fff; overflow:hidden; transition:border-color .15s, box-shadow .15s; }
.fgroup:focus-within { border-color:var(--ink); box-shadow:0 3px 0 var(--ink); }
.fld { display:block; position:relative; margin:0; padding:11px 15px 11px; cursor:text; transition:background .15s; }
.fld + .fld { border-top:2px solid var(--line-2); }
.fld > span { display:block; margin-bottom:3px; font-size:11px; font-weight:900; letter-spacing:1.1px; text-transform:uppercase; color:var(--ink-3); }
.fld > span small { text-transform:none; letter-spacing:0; font-weight:700; font-size:12px; }
.fld input, .fld select { border:0 !important; border-radius:0; padding:0; font-size:17px; font-weight:800; background:transparent; box-shadow:none !important; }
.fld input::placeholder { font-weight:700; color:#B9AC9F; }
.fld select.empty { color:#B9AC9F; font-weight:700; }
.fld select { text-align:left; text-align-last:left; padding-right:34px; text-indent:0; }
.fld:focus-within { background:#FFFAF4; }
.fld:focus-within > span { color:var(--red-2); }
.fld.bad { background:#FDF1EC; box-shadow:none !important; border-color:var(--line-2) !important; }
.fld.bad > span { color:var(--red-2); }
.fld .phonef { border:0; border-radius:0; box-shadow:none !important; background:transparent; }
.fld .phonef .ccbox { padding:0 10px 0 0; border-right:2px solid var(--line-2); font-size:17px; }
.fld .phonef input { padding-left:12px; }
.fld.sel::after { top:auto; bottom:18px; transform:rotate(45deg); }
.fgroup .ferr { margin:0; padding:0 15px 11px; background:#FDF1EC; }
.lab { margin:16px 0 8px; font-size:11px; font-weight:900; letter-spacing:1.1px; text-transform:uppercase; color:var(--ink-3); }
.lab small { text-transform:none; letter-spacing:0; font-weight:700; font-size:12px; }
.sel { position:relative; }
.sel select { appearance:none; -webkit-appearance:none; padding-right:42px; cursor:pointer; }
.sel::after { content:""; position:absolute; right:16px; top:50%; width:9px; height:9px; border-right:2.5px solid var(--ink); border-bottom:2.5px solid var(--ink); transform:translateY(-70%) rotate(45deg); pointer-events:none; }
.sel.bad select { border-color:var(--red-2); }
.loc2, .shot { display:grid; grid-template-columns:44px minmax(0,1fr) auto; gap:12px; align-items:center; margin-top:12px; padding:12px; border:2px dashed var(--ink-3); border-radius:16px; cursor:pointer; background:#fff; }
.loc2 .pin, .shot .cam { width:44px; height:44px; border-radius:12px; background:var(--bg); display:grid; place-items:center; color:var(--ink-2); }
.loc2 .pin svg, .shot .cam svg { width:24px; height:24px; }
.loc2 .lt b, .shot .lt b { display:block; font-weight:900; font-size:15px; }
.loc2 .lt small, .shot .lt small { display:block; font-size:12.5px; font-weight:700; color:var(--ink-2); }
.loc2 .go { font-weight:900; font-size:13.5px; color:#fff; background:var(--ink); border-radius:999px; padding:7px 12px; }
.loc2.ok, .shot.ok { border-style:solid; border-color:var(--ink); }
.loc2.ok .pin, .shot.ok .cam { background:var(--ok-soft); color:var(--ok); }
.loc2.ok .go { background:#fff; color:var(--ink); border:2px solid var(--ink); padding:5px 11px; }
button.loc2 { width:100%; font:inherit; color:inherit; text-align:left; }
.loc2.bad { border-style:solid; border-color:var(--red-2); }
.shot input { position:absolute; opacity:0; width:1px; height:1px; }
.shot img { width:44px; height:44px; object-fit:cover; border-radius:10px; border:2px solid var(--ink); }
.mlist { margin-top:12px; border:2px solid var(--ink); border-radius:16px; overflow:hidden; background:#fff; }
.mlist.bad { box-shadow:0 0 0 3px rgba(200,55,29,.25) !important; border-color:var(--red-2); }
.mgrp { padding:8px 14px 7px; background:var(--bg); font-size:10.5px; font-weight:900; letter-spacing:1.4px; text-transform:uppercase; color:var(--ink-2); border-top:2px solid var(--ink); }
.mgrp:first-child { border-top:0; }
.mrow { display:grid; grid-template-columns:34px minmax(0,1fr) 124px; gap:12px; align-items:center; margin:0; padding:9px 14px; border-top:1.5px solid var(--line-2); cursor:text; }
.mgrp + .mrow { border-top:0; }
.mrow img { width:34px; height:52px; object-fit:cover; object-position:50% 45%; border-radius:8px; background:#F4F2EF; }
.mw b { display:block; font-weight:900; font-size:15.5px; line-height:1.2; }
.mw small { display:block; font-size:12px; font-weight:700; color:var(--ink-3); }
.mp { display:flex; align-items:baseline; gap:3px; padding:4px 2px 3px; border-bottom:2px dashed var(--line); min-width:0; }
.mp i { font-style:normal; font-family:var(--serif); font-size:17px; color:var(--ink-3); }
.mp input { flex:1; border:0; border-radius:0; padding:0; width:0; min-width:0; text-align:right; font-family:var(--serif); font-weight:400; font-size:21px; letter-spacing:.3px; background:transparent; box-shadow:none !important; }
.mp input::placeholder { font-family:var(--sans); font-size:13px; font-weight:800; color:var(--ink-3); }
.mrow:focus-within .mp { border-bottom:2px solid var(--red); }
.mrow.set .mp { border-bottom:2px solid var(--ink); } .mrow.set .mp i { color:var(--ink); }
.tog { display:flex; align-items:center; gap:12px; margin:14px 0 0; font-weight:800; font-size:14.5px; cursor:pointer; }
.tog input { position:absolute; opacity:0; width:1px; height:1px; }
.tog .sw { flex:none; width:44px; height:26px; border-radius:999px; background:var(--line); border:2px solid var(--ink-3); position:relative; transition:background .15s, border-color .15s; }
.tog .sw::after { content:""; position:absolute; left:2px; top:2px; width:18px; height:18px; border-radius:50%; background:#fff; box-shadow:0 1px 2px rgba(0,0,0,.25); transition:transform .15s; }
.tog input:checked + .sw { background:var(--red); border-color:var(--ink); }
.tog input:checked + .sw::after { transform:translateX(18px); }
.picku { display:grid; gap:8px; margin-top:12px; }
.wc { display:grid; grid-template-columns:40px minmax(0,1fr) 26px; gap:12px; align-items:center; width:100%; text-align:left; font:inherit; color:var(--ink); background:#fff; border:2px solid var(--line); border-radius:14px; padding:10px 12px; cursor:pointer; transition:border-color .15s, box-shadow .15s; }
.wc .av { width:40px; height:40px; border-radius:50%; background:var(--gold-soft); color:var(--gold); border:2px solid var(--ink); display:grid; place-items:center; font-family:var(--serif); font-size:19px; }
.wc .t b { display:block; font-weight:900; font-size:15px; }
.wc .t small { display:block; font-size:12.5px; font-weight:700; color:var(--ink-2); }
.wc .ck { width:26px; height:26px; border-radius:50%; border:2px solid var(--line); display:grid; place-items:center; color:transparent; }
.wc .ck svg { width:14px; height:14px; }
.wc.on { border-color:var(--ink); box-shadow:0 3px 0 var(--ink); }
.wc.on .ck { background:var(--red); border-color:var(--ink); color:#fff; }
.or { margin:8px 2px 0; font-size:12.5px; font-weight:700; color:var(--ink-3); }
.send { display:flex; align-items:center; justify-content:center; gap:10px; width:100%; margin-top:18px; padding:16px; background:var(--red); color:#fff; border:2.5px solid var(--ink); border-radius:18px; box-shadow:0 4px 0 var(--ink); font:inherit; font-weight:900; font-size:17px; cursor:pointer; }
.send svg { width:20px; height:20px; }
.send:active { transform:translateY(3px); box-shadow:0 1px 0 var(--ink); }
.send:disabled { opacity:.6; }
.phonef { display:flex; align-items:stretch; border:2px solid var(--line); border-radius:14px; background:#fff; overflow:hidden; transition:border-color .15s, box-shadow .15s; }
.phonef:focus-within { border-color:var(--ink); box-shadow:0 3px 0 var(--ink); }
.phonef.bad { border-color:var(--red-2); box-shadow:0 0 0 4px rgba(200,55,29,.14); }
.ccbox { position:relative; flex:none; display:flex; align-items:center; gap:6px; padding:0 10px 0 13px; border-right:2px solid var(--line); font-weight:800; font-size:16px; white-space:nowrap; }
.ccbox svg { width:10px; height:8px; color:var(--ink-3); }
.ccbox select { position:absolute; inset:0; width:100%; height:100%; opacity:0; cursor:pointer; border:0; padding:0; }
.phonef input { flex:1; min-width:0; border:0; border-radius:0; box-shadow:none !important; letter-spacing:.3px; }
.bps .phonef + .phonef { margin-top:8px; }
.addbp { margin-top:8px; background:none; border:0; padding:4px 0; font:inherit; font-weight:900; font-size:14px; color:var(--red-2); cursor:pointer; }
.money { position:relative; } .money input { padding-left:28px; } .money::before { content:"₦"; position:absolute; left:12px; top:50%; transform:translateY(-50%); font-weight:800; color:var(--ink-3); }
.btn { display:block; width:100%; margin-top:16px; padding:14px; border:0; border-radius:999px; background:var(--red); color:#fff; font:inherit; font-weight:900; font-size:16px; box-shadow:0 3px 0 var(--red-2); cursor:pointer; text-align:center; text-decoration:none; }
.btn:disabled { opacity:.55; cursor:default; }
.btn.ghost { background:#fff; color:var(--ink); border:1.5px solid var(--line); box-shadow:none; }
.btn.sm { display:inline-block; width:auto; margin:0; padding:8px 14px; font-size:14px; }
.loc { display:flex; align-items:center; gap:10px; margin-top:10px; }
.loc .btn { margin:0; flex:none; width:auto; padding:10px 16px; font-size:14.5px; }
.loc .st { font-size:13.5px; font-weight:800; color:var(--ink-2); }
.loc .st.ok { color:var(--ok); }
.acct { margin-top:10px; border-radius:12px; padding:10px 12px; font-weight:800; font-size:14px; }
.acct.ok { background:var(--ok-soft); color:var(--ok); }
.acct.no { background:var(--gold-soft); color:var(--gold); }
.acct small { display:block; font-weight:700; color:var(--ink-2); margin-top:2px; }
.photo { display:flex; align-items:center; gap:12px; margin-top:8px; }
.photo img { width:64px; height:64px; object-fit:cover; border-radius:10px; border:1px solid var(--line); }
.chk { display:flex; gap:10px; align-items:center; font-weight:800; font-size:14px; margin-top:12px; }
.chk input { width:20px; height:20px; accent-color:var(--red); }
.hi { margin:0 0 2px; font-weight:800; color:var(--ink-2); }
/* which store is it */
.search { position:relative; margin:4px 0 12px; }
.search input { padding-left:42px; border:2px solid var(--ink); border-radius:14px; }
.search svg { position:absolute; left:14px; top:50%; transform:translateY(-50%); width:18px; height:18px; color:var(--ink-2); }
.locating { display:flex; align-items:center; gap:10px; margin:6px 2px 12px; font-size:13.5px; font-weight:800; color:var(--ink-2); }
.locating i { width:10px; height:10px; border-radius:50%; background:var(--red); box-shadow:0 0 0 0 rgba(231,69,41,.5); animation:ping 1.4s infinite; }
@keyframes ping { 70% { box-shadow:0 0 0 10px rgba(231,69,41,0); } 100% { box-shadow:0 0 0 0 rgba(231,69,41,0); } }
.picks { display:flex; flex-direction:column; gap:10px; }
.pick { display:grid; grid-template-columns:44px minmax(0,1fr) auto; gap:12px; align-items:center; width:100%; text-align:left; font:inherit; color:var(--ink); background:var(--card); border:2px solid var(--ink); border-radius:16px; padding:12px; box-shadow:0 3px 0 var(--ink); cursor:pointer; }
.pick:active { transform:translateY(2px); box-shadow:0 1px 0 var(--ink); }
.pick .ic { width:44px; height:44px; border-radius:12px; background:var(--red-soft, #FDECE7); color:var(--red-2); border:2px solid var(--ink); display:grid; place-items:center; font-family:var(--serif); font-size:22px; }
.pick .dist { font-size:12.5px; font-weight:900; color:var(--ink-2); white-space:nowrap; align-self:start; padding-top:2px; }
.pick .tags { display:flex; flex-wrap:wrap; gap:5px; margin-top:6px; }
.tag { display:inline-block; font-size:11.5px; font-weight:900; border-radius:999px; padding:2px 9px; background:var(--line-2); color:var(--ink-2); }
.tag.ok { background:var(--ok-soft); color:var(--ok); } .tag.gold { background:var(--gold-soft); color:var(--gold); } .tag.red { background:#FDECE7; color:var(--red-2); }
.pick.off { opacity:.7; box-shadow:none; border-style:dashed; cursor:default; }
.pick.off .ic { background:var(--line-2); color:var(--ink-3); }
.pick.asked .ic { background:var(--gold-soft); color:var(--gold); }
.newst { display:flex; align-items:center; justify-content:center; gap:8px; width:100%; margin-top:14px; padding:13px; border:2px dashed var(--ink-3); border-radius:16px; background:transparent; font:inherit; font-weight:900; font-size:15px; color:var(--ink); cursor:pointer; }
.pnote { margin:0 0 12px; padding:11px 13px; border-radius:12px; background:var(--gold-soft); font-weight:800; font-size:14px; color:var(--ink); }
.rec { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:10px; align-items:start; margin:0 0 14px; padding:13px 14px; background:var(--card); border:2px solid var(--ink); border-radius:16px; box-shadow:0 3px 0 var(--ink); }
.rec small { display:block; font-size:11px; font-weight:900; letter-spacing:1px; text-transform:uppercase; color:var(--ink-3); margin-bottom:3px; }
.rec b { display:block; font-weight:900; font-size:17px; line-height:1.2; }
.rec span { display:block; font-size:13px; font-weight:700; color:var(--ink-2); margin-top:2px; }
.rec .tags { margin-top:7px; display:flex; flex-wrap:wrap; gap:5px; }
.rec button { background:none; border:0; font:inherit; font-weight:900; font-size:14px; color:var(--red-2); cursor:pointer; padding:2px; }
.chips2 { display:flex; flex-wrap:wrap; gap:6px; margin:8px 0 0; }
.chips2 button { border:1.5px solid var(--line); background:#fff; border-radius:999px; padding:6px 12px; font:inherit; font-size:13.5px; font-weight:800; color:var(--ink); cursor:pointer; }
.chips2 button small { color:var(--ink-2); font-weight:700; }
.dup { margin-top:12px; padding:14px; border:2px solid var(--ink); border-radius:14px; background:var(--gold-soft); color:var(--ink); }
.dup p { margin:0 0 10px; font-weight:800; font-size:14.5px; }
.dup .row2 { display:flex; gap:8px; flex-wrap:wrap; }
.dup .btn { margin:0; width:auto; flex:1; padding:11px 14px; font-size:14.5px; }
.tiles { display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:8px; margin:14px 0 4px; }
.tile { background:var(--card); border:2px solid var(--ink); border-radius:16px; padding:10px 12px; }
.tile b { display:block; font-family:var(--serif); font-weight:400; font-size:30px; line-height:1; }
.tile span { font-size:12px; font-weight:900; letter-spacing:.6px; text-transform:uppercase; color:var(--ink-2); }
.tile.live b { color:var(--ok); } .tile.wait b { color:var(--gold); } .tile.back b { color:var(--ink-3); }
.tile.back.hot { background:var(--red); border-color:var(--ink); } .tile.back.hot b, .tile.back.hot span { color:#fff; }
.cta { display:flex; align-items:center; gap:14px; width:100%; margin-top:16px; padding:14px 16px; background:var(--red); color:#fff; border:2.5px solid var(--ink); border-radius:20px; box-shadow:0 4px 0 var(--ink); font:inherit; text-align:left; cursor:pointer; }
.cta:active { transform:translateY(3px); box-shadow:0 1px 0 var(--ink); }
.cta .plus { width:40px; height:40px; flex:none; border-radius:12px; background:#fff; color:var(--red); border:2px solid var(--ink); display:grid; place-items:center; font-size:26px; font-weight:900; line-height:1; }
.cta b { display:block; font-size:18px; font-weight:900; }
.cta small { display:block; font-size:13px; font-weight:700; opacity:.9; }
.guide { display:block; text-align:center; margin-top:12px; font-weight:800; font-size:14px; color:var(--red-2); }
.sh { display:flex; align-items:center; gap:8px; margin:28px 0 6px; }
.sh h2 { font-family:var(--serif); font-weight:400; font-size:24px; margin:0; }
.count { background:var(--ink); color:#fff; border-radius:999px; font-size:12px; font-weight:900; padding:2px 9px; }
.shsub { margin:0 0 10px; color:var(--ink-2); font-weight:700; font-size:14px; }
.cards { display:flex; flex-direction:column; gap:10px; }
.ask, .store { background:var(--card); border:2px solid var(--ink); border-radius:16px; padding:12px; display:grid; gap:10px; align-items:center; box-shadow:0 3px 0 var(--ink); }
.ask { grid-template-columns:44px minmax(0,1fr) auto; }
.ask .av { width:44px; height:44px; border-radius:12px; background:var(--gold-soft); color:var(--gold); border:2px solid var(--ink); display:grid; place-items:center; font-family:var(--serif); font-size:22px; }
.info { min-width:0; }
.info b { display:block; font-weight:900; font-size:16px; line-height:1.2; overflow-wrap:anywhere; }
.info span { display:block; font-size:13px; color:var(--ink-2); font-weight:700; }
.info em { display:inline-block; margin-top:4px; font-style:normal; font-size:11.5px; font-weight:900; color:var(--ok); background:var(--ok-soft); border-radius:999px; padding:1px 8px; }
.acts { display:flex; gap:6px; align-items:center; }
.wa { width:40px; height:40px; border-radius:50%; background:#25D366; color:#fff; border:2px solid var(--ink); display:grid; place-items:center; }
.wa svg { width:22px; height:22px; }
.add { border:2px solid var(--ink); background:var(--red); color:#fff; border-radius:999px; padding:8px 14px; font:inherit; font-weight:900; font-size:14px; cursor:pointer; box-shadow:0 2px 0 var(--ink); white-space:nowrap; }
.store { grid-template-columns:minmax(0,1fr) auto; border-left-width:7px; }
.store.live { border-left-color:var(--ok); } .store.wait { border-left-color:var(--gold); } .store.back { border-left-color:var(--red); } .store.off { border-left-color:var(--ink-3); opacity:.75; }
.fixbox { grid-column:1 / -1; display:flex; gap:10px; align-items:center; justify-content:space-between; background:var(--warn-soft); border-radius:12px; padding:10px 12px; }
.fixbox p { margin:0; color:var(--red-2); font-weight:800; font-size:13.5px; }
.pill { border-radius:999px; padding:3px 10px; font-size:12px; font-weight:900; white-space:nowrap; }
.pill.wait { background:var(--gold-soft); color:var(--gold); } .pill.live { background:var(--ok-soft); color:var(--ok); }
.pill.back { background:var(--warn-soft); color:var(--red-2); } .pill.off { background:var(--line-2); color:var(--ink-2); }
.empty { border:2px dashed var(--line); border-radius:16px; padding:20px; color:var(--ink-2); font-weight:700; text-align:center; }
.empty b { display:block; color:var(--ink); font-size:16px; margin-bottom:2px; }
.done { text-align:center; padding:22px 8px 6px; }
.done .tick { width:60px; height:60px; border-radius:50%; background:var(--red); color:#fff; display:flex; align-items:center; justify-content:center; margin:0 auto 14px; }
.done .tick.wait { background:var(--gold); }
.err { color:var(--red-2); font-weight:800; font-size:14px; margin-top:10px; min-height:1em; }
.bad { border-color:var(--red-2) !important; box-shadow:0 0 0 4px rgba(200,55,29,.14) !important; }
.ferr { display:flex; gap:7px; color:var(--red-2); font-weight:800; font-size:13.5px; margin:7px 2px 0; }
.ferr::before { content:"!"; flex:none; width:17px; height:17px; border-radius:50%; background:var(--red-2); color:#fff; font-size:11px; font-weight:900; display:flex; align-items:center; justify-content:center; margin-top:1px; }
.muted { color:var(--ink-2); font-size:14px; }
.dev { color:var(--ink-3); font-size:13px; }
@media (max-width:360px) { .row { grid-template-columns:1fr; } }
@media (prefers-reduced-motion: reduce) { * { scroll-behavior:auto !important; } }
</style>

<body>
<header class="top"><div class="in"><a class="brand" href="/"><b>Andiamo!</b><small>Onboard</small></a><div class="who" id="who"></div></div></header>
<main id="app"></main>
<script>
(() => {
  const API = "/api/outside-onboard", app = document.getElementById("app"), $ = (id) => document.getElementById(id);
  const LS = { get(k) { try { return localStorage.getItem(k); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} }, del(k) { try { localStorage.removeItem(k); } catch {} } };
  const esc = (x) => String(x == null ? "" : x).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  // Phone numbers: a flag and country code in the field, a native list behind it, as in the guest app. Nigeria by default.
  const CCS = [["234", "NG", "Nigeria"], ["233", "GH", "Ghana"], ["254", "KE", "Kenya"], ["27", "ZA", "South Africa"], ["225", "CI", "Côte d'Ivoire"], ["229", "BJ", "Benin"], ["228", "TG", "Togo"], ["237", "CM", "Cameroon"], ["221", "SN", "Senegal"],
    ["44", "GB", "United Kingdom"], ["1", "US", "United States, Canada"], ["353", "IE", "Ireland"], ["33", "FR", "France"], ["49", "DE", "Germany"], ["39", "IT", "Italy"], ["31", "NL", "Netherlands"], ["34", "ES", "Spain"], ["41", "CH", "Switzerland"],
    ["971", "AE", "United Arab Emirates"], ["974", "QA", "Qatar"], ["966", "SA", "Saudi Arabia"], ["61", "AU", "Australia"], ["86", "CN", "China"], ["91", "IN", "India"], ["55", "BR", "Brazil"]];
  const flagOf = (iso) => iso.replace(/./g, (ch) => String.fromCodePoint(127397 + ch.charCodeAt(0)));
  const ccLabel = (cc) => { const x = CCS.find(([k]) => k === cc) || CCS[0]; return `${flagOf(x[1])} +${x[0]}`; };
  const NG_HINT = "803 000 0000";
  // A saved number (+2348031234567) back into its country and the rest (803 123 4567).
  const splitPhone = (v) => { const d = String(v || "").replace(/\D/g, ""); if (!String(v || "").trim().startsWith("+")) return ["234", String(v || "")]; const x = [...CCS].sort((a, b) => b[0].length - a[0].length).find(([k]) => d.startsWith(k)); return x ? [x[0], d.slice(x[0].length)] : ["234", "+" + d]; };
  const phoneField = (id, value = "") => {
    const [cc, rest] = splitPhone(value);
    return `<div class="phonef"><span class="ccbox"><span id="${id}_ccv">${ccLabel(cc)}</span><svg viewBox="0 0 12 8" aria-hidden="true"><path d="M1 1.5l5 5 5-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <select id="${id}_cc" aria-label="Country">${CCS.map(([k, iso, n]) => `<option value="${k}"${k === cc ? " selected" : ""}>${flagOf(iso)} ${esc(n)} +${k}</option>`).join("")}</select></span>
      <input id="${id}" type="tel" inputmode="tel" autocomplete="tel" placeholder="${cc === "234" ? NG_HINT : ""}" value="${esc(rest)}"></div>`;
  };
  // What was typed, with its country code. Typed with + or 00, it keeps its own.
  const phoneOf = (id) => { const inp = $(id), sel = $(id + "_cc"); const raw = String(inp && inp.value || "").trim(), d = raw.replace(/\D/g, ""); if (!d) return ""; if (raw.startsWith("+") || raw.startsWith("00")) return raw; return "+" + (sel ? sel.value : "234") + d.replace(/^0+/, ""); };
  function wirePhone(id) {
    const sel = $(id + "_cc"), inp = $(id), v = $(id + "_ccv"); if (!sel || !inp) return;
    sel.onchange = () => { v.textContent = ccLabel(sel.value); inp.placeholder = sel.value === "234" ? NG_HINT : ""; inp.focus(); };
    // The code is already in the box, so a leading 0 is dropped as they type (0803 becomes 803).
    const trim = () => { if (/^\s*0/.test(inp.value)) inp.value = inp.value.replace(/^\s*0+/, ""); };
    inp.addEventListener("input", trim); trim();
  }
  let at = LS.get("andiamo.onb") || "", S = null;
  const ERR = {
    not_onboarder: "This number isn't set up to add stores. Ask your Amabile contact.", phone: "Check the number.", slow_down: "Too many codes. Try again in a few minutes.",
    send_failed: "We couldn't send the code just now. Try again in a minute.", not_on_whatsapp: "That number isn't on WhatsApp. Check the number and the country code.", expired: "That code has expired. Send a new one.", wrong_code: "That code isn't right.", too_many: "Too many tries. Send a new code.",
    name: "Add the store's name.", area: "Choose the area.", kind: "Choose what kind of place it is.", location: "Turn on location for this site, standing in the store, so we can place it on the map.", here: "We need its location. Tap I'm here while you're standing in it.", prices: "Add the menu price of at least one wine.",
    manager_name: "Add the manager's name.", manager_phone: "Check the manager's WhatsApp number.", bar_phone: "Check the bar phone numbers.", account_number: "Account numbers have 10 digits.", bank: "Choose the bank.",
    resolve: "The bank doesn't recognise that account. Check the number and the bank.", already_live: "This store is already live on Andiamo!", outlet: "Choose the store again.", duplicate: "You've already sent this store. It's waiting for approval.", request_taken: "Someone has already added this venue.", not_editable: "This store can't be changed now.",
    offline: "You're offline. Try again.", server: "Something went wrong. Try again."
  };
  async function api(body) {
    try { const r = await fetch(API, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ ...(at ? { at } : {}), ...body }) });
      const d = await r.json().catch(() => ({ ok: false, error: "server" }));
      if (r.status === 401 && body.action !== "verify") { signOut(); signIn(ERR.not_onboarder); throw new Error("auth"); }
      return d; } catch (e) { if (e.message === "auth") throw e; return { ok: false, error: "offline" }; }
  }
  function flag(el, text) {
    if (!el) return;
    const host = el.closest(".fld, .phonef, .sel") || el;
    unflag(host); host.classList.add("bad");
    const p = document.createElement("p"); p.className = "ferr"; p.setAttribute("role", "alert"); p.textContent = text; host.insertAdjacentElement("afterend", p);
    host.scrollIntoView({ block: "center", behavior: "smooth" });
    try { navigator.vibrate && navigator.vibrate(60); } catch {}
    if (el.matches("input, select")) try { el.focus({ preventScroll: true }); } catch {}
    const off = () => unflag(host); ["input", "change", "click"].forEach((e) => el.addEventListener(e, off, { once: true }));
  }
  function unflag(el) { const n = el.nextElementSibling; if (n && n.classList.contains("ferr")) n.remove(); el.classList.remove("bad"); }
  function signOut() { at = ""; S = null; LS.del("andiamo.onb"); $("who").innerHTML = ""; }
  const top = () => window.scrollTo(0, 0);

  // ---------- sign in ----------
  function signIn(msg) {
    $("who").innerHTML = "";
    app.innerHTML = `<h1>Add stores to Andiamo</h1><p class="sub">Sign in with your WhatsApp number.</p>
      <div class="panel"><div class="sec"><label for="ph">Your WhatsApp number</label>${phoneField("ph")}
        <div id="cbox" hidden><label for="cd">Code from WhatsApp</label><input id="cd" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="6 digits"><p class="dev" id="dev"></p></div>
        <button class="btn" id="go">Send me a code</button><p class="err" id="err" role="alert"></p></div></div>`;
    let sent = false, busy = false;
    if (msg) $("err").textContent = msg;
    wirePhone("ph");
    $("ph").oninput = () => { if (sent) { sent = false; $("cbox").hidden = true; $("go").textContent = "Send me a code"; } };
    const go = async () => {
      if (busy) return; $("err").textContent = "";
      const phone = phoneOf("ph"); if (phone.replace(/\D/g, "").length < 8) return flag($("ph"), "Add your WhatsApp number.");
      busy = true; $("go").disabled = true;
      try {
        if (!sent) {
          const r = await api({ action: "start", phone }); if (!r.ok) return r.error === "not_onboarder" ? ($("err").textContent = ERR.not_onboarder) : flag($("ph"), ERR[r.error] || ERR.server);
          sent = true; $("cbox").hidden = false; $("dev").textContent = r.devCode ? "Test code: " + r.devCode : ""; $("go").textContent = "Sign in"; $("cd").focus(); return;
        }
        if ($("cd").value.replace(/\D/g, "").length < 6) return flag($("cd"), "Enter the 6-digit code from WhatsApp.");
        const r = await api({ action: "verify", phone, code: $("cd").value });
        if (!r.ok) return ["wrong_code", "expired", "too_many"].includes(r.error) ? flag($("cd"), ERR[r.error]) : ($("err").textContent = ERR[r.error] || ERR.server);
        at = r.token; LS.set("andiamo.onb", at); home();
      } finally { busy = false; $("go").disabled = false; }
    };
    $("go").onclick = go; $("cd").onkeydown = $("ph").onkeydown = (e) => { if (e.key === "Enter") go(); };
  }

  // ---------- my stores ----------
  const STAGE = { submitted: ["Waiting", "wait"], live: ["Live", "live"], sent_back: ["Needs a fix", "back"], declined: ["Not taken", "off"], listed: ["Approved", "live"] };
  async function load() { const r = await api({ action: "me" }); if (!r.ok) { signIn(ERR[r.error]); return null; } S = r; return r; }
  async function home(flash) {
    const r = await load(); if (!r) return;
    const nm = String(r.me.name || "?").trim(), ws = nm.split(/\s+/);
    const ini = (ws.length > 1 ? ws[0][0] + ws[1][0] : /^[A-Z]{2,3}$/.test(nm) ? nm : nm[0]).toUpperCase();
    $("who").innerHTML = `<button class="me" id="me" aria-haspopup="true" aria-expanded="false"><i>${esc(ini)}</i>${esc(r.me.name)}<svg viewBox="0 0 12 8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M1 1.5l5 5 5-5"/></svg></button>
      <div class="menu" id="menu" hidden><a href="/onboard/guide">How it works</a><button id="out">Sign out</button></div>`;
    $("me").onclick = (e) => { e.stopPropagation(); const m = $("menu"); m.hidden = !m.hidden; $("me").setAttribute("aria-expanded", String(!m.hidden)); };
    document.onclick = () => { const m = $("menu"); if (m) m.hidden = true; };
    $("out").onclick = () => { signOut(); signIn(); };
    const n = (st) => r.stores.filter((x) => x.stage === st).length;
    const asked = r.asked || [];
    const ago = (t) => { const d = Math.floor((Date.now() - t) / 864e5); return d < 1 ? "today" : d === 1 ? "yesterday" : d + " days ago"; };
    const WA = '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm5.5 14.1c-.2.7-1.3 1.3-1.8 1.3-.5.1-1 .2-3.3-.7-2.8-1.1-4.6-3.9-4.7-4.1-.1-.2-1.1-1.5-1.1-2.9s.7-2 1-2.3c.3-.3.6-.3.8-.3h.6c.2 0 .4 0 .6.5l.9 2.1c.1.2.1.4 0 .6l-.4.6-.4.5c-.1.2-.3.3-.1.6.2.3.8 1.3 1.7 2.1 1.2 1 2.1 1.4 2.4 1.5.3.1.5.1.7-.1l.9-1.1c.2-.3.4-.2.7-.1l2 1c.3.1.5.2.6.3.1.2.1.8-.2 1.4z"/></svg>';
    const tiles = r.stores.length ? `<div class="tiles"><div class="tile live"><b>${n("live")}</b><span>Live</span></div><div class="tile wait"><b>${n("submitted")}</b><span>Waiting</span></div><div class="tile back${n("sent_back") ? " hot" : ""}"><b>${n("sent_back")}</b><span>Needs a fix</span></div></div>` : "";
    const order = { sent_back: 0, submitted: 1, live: 2, declined: 3 };
    const stores = r.stores.slice().sort((x, y) => (order[x.stage] ?? 9) - (order[y.stage] ?? 9));
    app.innerHTML = (flash || "") + `<h1>Your stores</h1>${tiles}
      <button class="cta" id="add"><span class="plus">+</span><span><b>Add a store</b><small>While standing in it. Takes about 3 mins</small></span></button>
      <a class="guide" href="/onboard/guide">New to this? Read the guide</a>
      ${asked.length ? `<div class="sh"><h2>Asked to join</h2><span class="count">${asked.length}</span></div><p class="shsub">They signed up themselves. Message the manager, go, then add it from inside.</p>
        <div class="cards">${asked.map((q) => `<div class="ask"><div class="av">${esc((q.name || "?").trim().charAt(0).toUpperCase())}</div>
          <div class="info"><b>${esc(q.name)}</b><span>${esc(q.area)} · ${esc(q.contactName)} · ${ago(q.createdAt)}</span>${q.matched && q.prices ? '<em>Ready: add the bank</em>' : q.stocksAmabile === "yes" ? '<em>Sells Amabile</em>' : ""}</div>
          <div class="acts"><a class="wa" href="https://wa.me/${esc(String(q.phone || "").replace(/\D/g, ""))}" target="_blank" rel="noopener" aria-label="WhatsApp ${esc(q.contactName)}">${WA}</a><button class="add" data-from="${esc(q.id)}">Add it</button></div></div>`).join("")}</div>` : ""}
      <div class="sh"><h2>${asked.length ? "Yours" : "Your list"}</h2>${r.stores.length ? `<span class="count">${r.stores.length}</span>` : ""}</div>
      ${stores.length ? `<div class="cards">${stores.map((x) => { const [t, c] = STAGE[x.stage] || ["Waiting", "wait"]; return `<div class="store ${c}"><div class="info"><b>${esc(x.name)}</b><span>${esc(x.area)} · ${ago(x.createdAt)}</span></div><span class="pill ${c}">${t}</span>
        ${x.stage === "sent_back" ? `<div class="fixbox"><p>${esc(x.returnNote)}</p><button class="add" data-fix="${esc(x.id)}">Fix it</button></div>` : ""}</div>`; }).join("")}</div>`
        : `<div class="empty"><b>Nothing yet</b>Your first store shows here once you send it.</div>`}`;
    $("add").onclick = () => pick();
    app.querySelectorAll("[data-from]").forEach((b) => (b.onclick = () => { const q = asked.find((y) => y.id === b.dataset.from);
      form({ fromRequest: q.id, outlet: q.outlet || "", name: q.name, area: q.area, kind: q.kind, prices: q.prices || {}, managerName: q.contactName, managerPhone: q.phone,
        ...(q.lat != null ? { lat: q.lat, lng: q.lng, locFrom: "records" } : {}), rec: q.matched ? { name: q.name, place: q.address, cases: q.records && q.records.cases, lastBought: q.records && q.records.lastBought, asked: true } : null }); }));
    app.querySelectorAll("[data-fix]").forEach((b) => (b.onclick = () => { const x = r.stores.find((y) => y.id === b.dataset.fix); form({ ...x.store, id: x.id, account: "", bankCode: (x.store.payout || {}).bankCode || "" }); }));
    top();
  }

  // ---------- which store is it ----------
  // Standing in it, the store is usually already in our records: closest first, or by name. Picking one fills
  // in the name, area, type and location; our own people also get the manager's details we hold.
  const far = (a, b) => { const R = 6371000, t = Math.PI / 180, x = Math.sin((b.lat - a.lat) * t / 2) ** 2 + Math.cos(a.lat * t) * Math.cos(b.lat * t) * Math.sin((b.lng - a.lng) * t / 2) ** 2; return 2 * R * Math.asin(Math.sqrt(x)); };
  const dist = (m) => m == null ? "" : m < 1000 ? Math.round(m / 10) * 10 + " m" : (m / 1000).toFixed(1) + " km";
  const MON = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
  const day = (d) => { const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(d || ""); return m ? +m[3] + " " + MON[+m[2] - 1] : ""; };
  const SRCH = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>';
  function tagsFor(o) {
    const t = [];
    if (o.status === "live") t.push('<span class="tag ok">Live on Andiamo!</span>');
    else if (o.status === "waiting") t.push(`<span class="tag gold">${o.mine ? "You sent it" : "Waiting" + (o.waitingBy ? " · " + esc(o.waitingBy) : "")}</span>`);
    else if (o.status === "listed") t.push('<span class="tag gold">Being set up</span>');
    else if (o.status === "asked") t.push('<span class="tag red">Asked to join</span>');
    if (o.asked && o.asked.prices) t.push('<span class="tag ok">Prices in</span>');
    if (o.cases) t.push(`<span class="tag">${o.cases} cases this year</span>`);
    return t.join("");
  }
  async function pick(note) {
    let here = null, list = [], q = "", qT = 0, qN = 0;
    app.innerHTML = `<button class="btn sm ghost" id="back" style="margin-bottom:14px">← Your stores</button>
      <h1>Which store is it?</h1><p class="sub">From our records, closest first.</p>${note ? `<p class="pnote">${note}</p>` : ""}
      <div class="search">${SRCH}<input id="q" type="search" placeholder="Search by name" autocomplete="off" enterkeyhint="search"></div>
      <div id="near"><p class="locating"><i></i>Finding stores around you...</p></div>
      <button class="newst" id="new" type="button">+ It's not here. Add a new store</button>`;
    top();
    $("back").onclick = () => home();
    $("new").onclick = () => form(here ? { lat: here.lat, lng: here.lng, acc: here.acc, locFrom: "gps" } : {});
    const draw = (msg) => {
      if (!list.length) { $("near").innerHTML = `<p class="locating" style="animation:none">${msg}</p>`; return; }
      $("near").innerHTML = `<div class="picks">${list.map((o, i) => { const off = ["live", "waiting", "listed"].includes(o.status);
        const m = o.metres != null ? o.metres : here && o.lat != null ? far(here, o) : null;
        return `<button class="pick${off ? " off" : ""}${o.status === "asked" ? " asked" : ""}" data-i="${i}"><span class="ic">${esc((o.name || "?").trim().charAt(0).toUpperCase())}</span>
          <span class="info"><b>${esc(o.name)}</b><span>${esc([o.type, o.place].filter(Boolean).join(" · "))}</span><span class="tags">${tagsFor(o)}</span></span><span class="dist">${dist(m)}</span></button>`; }).join("")}</div>`;
      $("near").querySelectorAll("[data-i]").forEach((b) => (b.onclick = () => choose(list[+b.dataset.i])));
    };
    const nearby = async () => {
      if (!here) return;
      const r = await api({ action: "nearby", lat: here.lat, lng: here.lng });
      if (q) return; list = r.ok ? r.stores : []; draw("Nothing in our records within 400 m. Search by name, or add it as a new store.");
    };
    if (navigator.geolocation) navigator.geolocation.getCurrentPosition((p) => { here = { lat: +p.coords.latitude.toFixed(6), lng: +p.coords.longitude.toFixed(6), acc: Math.round(p.coords.accuracy) }; nearby(); },
      () => { if (!q) { list = []; draw("Turn on location for this site to see stores around you, or search by name."); } }, { enableHighAccuracy: true, timeout: 15000, maximumAge: 30000 });
    else draw("Search by name.");
    $("q").addEventListener("input", () => {
      q = $("q").value.trim(); clearTimeout(qT);
      if (q.length < 2) { q = ""; if (here) nearby(); else { list = []; draw("Search by name."); } return; }
      qT = setTimeout(async () => { const n = ++qN, r = await api({ action: "find", q }); if (n !== qN || !q) return; list = r.ok ? r.stores : []; draw(`Nothing called “${esc(q)}” in our records. Add it as a new store.`); }, 200);
    });
    function choose(o) {
      if (o.status === "live") return pick(`<b>${esc(o.name)}</b> is already live on Andiamo!`);
      if (o.status === "waiting") return pick(o.mine ? `You've sent <b>${esc(o.name)}</b>. It's waiting for approval.` : `<b>${esc(o.name)}</b> is waiting for approval${o.waitingBy ? ", added by " + esc(o.waitingBy) : ""}.`);
      if (o.status === "listed") return pick(`<b>${esc(o.name)}</b> is already being set up at the back end.`);
      // Its location comes from our records. If they have none, it's taken on the form, only when you're standing in it.
      const loc = o.lat != null ? { lat: o.lat, lng: o.lng, locFrom: "records" } : {};
      const c = (o.contacts || [])[0];
      form({ outlet: o.ref, rec: o, name: o.name, area: o.area, kind: o.kind || "", ...loc,
        ...(o.asked ? { fromRequest: o.asked.id, prices: o.asked.prices || {}, managerName: o.asked.contactName, managerPhone: o.asked.phone }
          : c ? { managerName: c.name, managerPhone: c.phone } : {}) });
    }
  }

  // ---------- add a store ----------
  let banks = null;
  async function form(pre) {
    if (!banks) { const b = await api({ action: "banks" }); banks = b.ok ? b.banks : []; }
    const st = { kind: pre.kind || "", lat: pre.lat ?? null, lng: pre.lng ?? null, acc: pre.acc || 0, photo: null, acct: null, dupOk: false };
    const rec = pre.rec || null;
    const W = S.wines;
    const KIC = { lounge: '<path d="M5 4h14l-7 8z"/><path d="M12 12v7M8 20h8"/>', restaurant: '<path d="M7 3v8M5 3v4a2 2 0 0 0 4 0V3M7 11v10"/><path d="M17 3c-2.5 2-2.5 7 0 9v9"/>',
      hotel: '<path d="M3 19V7M3 14h18v5"/><path d="M21 19v-5a3 3 0 0 0-3-3h-8v3"/><circle cx="6.5" cy="11" r="1.6"/>', rooftop: '<path d="M4 21V11l5-3v13M9 21V4l7 4v13M16 21v-8l4 2v6M2 21h20"/>',
      beach: '<path d="M3 12a9 9 0 0 1 18 0z"/><path d="M12 12v7a2 2 0 0 0 4 0"/>', brewery: '<path d="M5 6h10v14H5z"/><path d="M15 9h2a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2h-2M8.5 10v6M11.5 10v6"/>',
      club: '<path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/>', garden: '<path d="M5 20c0-9 6-15 15-15 0 9-6 15-14 15"/><path d="M5 20c3-4 6-7 10-9"/>' };
    const svg = (d, w = 2.2) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round">${d}</svg>`;
    const kindName = (k) => (S.kinds.find(([x]) => x === k) || [k, ""])[1];
    const fam = (f) => W.filter((w) => (w.family || "frizzante") === f);
    const mrow = (w) => { const v = (pre.prices || {})[w.id]; const val = v ? String(v).replace(/\D/g, "").replace(/\B(?=(\d{3})+(?!\d))/g, ",") : "";
      return `<label class="mrow${val ? " set" : ""}" for="p-${w.id}"><img src="/outside/img/bottle-${esc(w.id)}.jpg" alt="" loading="lazy"><span class="mw"><b>${esc(w.name)}</b><small>${esc(w.kind || (w.family === "spumante" ? "Sparkling" : ""))}</small></span><span class="mp"><i>₦</i><input id="p-${w.id}" inputmode="numeric" autocomplete="off" placeholder="Not sold" value="${esc(val)}"></span></label>`; };
    const recC = rec && rec.contacts && rec.contacts.length ? rec.contacts : [];
    // A store from our records already has its name, area, kind and location: nothing to ask. A new one asks for them.
    const known = !!(rec && pre.name && pre.area && st.kind);
    // In our records but with no location: you can do everything else from anywhere, the pin only on site.
    const needHere = !!(rec && st.lat == null);
    let n = 0; const num = () => ++n;
    app.innerHTML = `<button class="btn sm ghost" id="back" style="margin-bottom:14px">← Your stores</button>
      <h1>${pre.id ? "Fix " + esc(pre.name) : "Add a store"}</h1><p class="sub">${S.me.auto ? "It goes live as soon as you send it." : "Amabile checks it, then it goes live."}</p>
      ${rec ? `<div class="rec"><div><small>${rec.asked || pre.fromRequest ? "Asked to join · in our records" : "From our records"}</small><b>${esc(rec.name)}</b><span>${esc([rec.type, rec.place].filter(Boolean).join(" · "))}</span>
        <div class="tags">${rec.lastBought ? `<span class="tag">Last bought ${day(rec.lastBought)}</span>` : ""}${rec.cases ? `<span class="tag">${rec.cases} cases this year</span>` : ""}${rec.accounts > 1 ? `<span class="tag">${rec.accounts} accounts</span>` : ""}${pre.fromRequest && Object.keys(pre.prices || {}).length ? '<span class="tag ok">Prices from the venue</span>' : ""}</div></div>
        ${pre.fromRequest && !rec.ref ? "" : '<button type="button" id="chgst">Change</button>'}</div>` : ""}
      ${needHere ? `<button type="button" class="loc2" id="here"><span class="pin">${svg('<path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/>')}</span><span class="lt"><b>Its location</b><small>Not in our records. Tap when you're standing in it.</small></span><span class="go">I'm here</span></button>` : ""}
      <section class="blk"${known ? " hidden" : ""} id="sblk"><header><span class="n">${known ? "" : num()}</span><div><h2>The store</h2></div></header>
        <div id="sfields">
          <div class="fgroup"><label class="fld" for="nm"><span>Name</span><input id="nm" maxlength="60" value="${esc(pre.name || "")}" autocomplete="off" placeholder="As on the sign outside"></label>
          <label class="fld sel" for="ar"><span>Area</span><select id="ar" class="${pre.area ? "" : "empty"}"><option value="">Choose the area</option>${S.areas.map((a) => `<option${pre.area === a ? " selected" : ""}>${esc(a)}</option>`).join("")}</select></label></div>
          <p class="lab">Kind of place</p><div class="kinds" id="kd">${S.kinds.map(([k, nn]) => `<button type="button" data-k="${k}" class="${st.kind === k ? "on" : ""}">${svg(KIC[k] || "")}<span>${nn}</span></button>`).join("")}</div></div></section>
      <section class="blk"><header><span class="n">${num()}</span><div><h2>Menu prices</h2><p>A bottle on their menu. Leave out what they don't sell.</p></div></header>
        <div class="mlist" id="mlist"><div class="mgrp">Frizzante</div>${fam("frizzante").map(mrow).join("")}${fam("spumante").length ? `<div class="mgrp">Spumante</div>${fam("spumante").map(mrow).join("")}` : ""}</div>
        <label class="shot" id="shot"><input type="file" id="ph" accept="image/*" capture="environment"><span class="cam">${svg('<path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/>')}</span><span class="lt"><b>Photo of the menu</b><small>Optional. It helps us check the prices.</small></span><img id="pv" alt="" hidden></label></section>
      <section class="blk"><header><span class="n">${num()}</span><div><h2>The manager</h2><p>They sign in to the bar phone with this number.</p></div></header>
        ${recC.length ? `<div class="picku">${recC.map((c, i) => `<button type="button" class="wc" data-c="${i}"><span class="av">${esc((c.name || "?").trim().charAt(0).toUpperCase())}</span><span class="t"><b>${esc(c.name || "Contact")}</b><small>WhatsApp ··· ${esc(c.phone.slice(-4))}</small></span><span class="ck">${svg('<path d="M5 12.5l4.5 4.5L19 7.5"/>', 3.2)}</span></button>`).join("")}</div><p class="or">On our records. Tap one, or type someone else.</p>` : ""}
        <div class="fgroup"><label class="fld" for="mn"><span>Name</span><input id="mn" maxlength="30" value="${esc(pre.managerName || "")}" placeholder="First name is fine"></label>
        <label class="fld" for="mp"><span>WhatsApp number</span>${phoneField("mp", pre.managerPhone || "")}</label></div>
        <p class="lab">Other bar phones <small>optional</small></p><div class="bps" id="bps">${(pre.barPhones && pre.barPhones.length ? pre.barPhones : [""]).map((x, i) => phoneField("bp" + i, x)).join("")}</div>
        <button class="addbp" id="addbp" type="button">+ Add another</button></section>
      <section class="blk"><header><span class="n">${num()}</span><div><h2>Where we pay them</h2><p>The store's own account. We pay its menu price for every bottle served.</p></div></header>
        <div class="fgroup"><label class="fld sel" for="bk"><span>Bank <small>optional for now</small></span><select id="bk" class="${pre.bankCode ? "" : "empty"}"><option value="">Choose the bank</option>${banks.map((b) => `<option value="${esc(b.code)}"${pre.bankCode === b.code ? " selected" : ""}>${esc(b.name)}</option>`).join("")}</select></label>
        <label class="fld" for="ac"><span>Account number</span><input id="ac" inputmode="numeric" maxlength="10" placeholder="10 digits"></label></div>
        <div id="an"></div></section>
      <button class="send" id="send">${S.me.auto ? "Put it live" : "Send for approval"}${svg('<path d="M5 12h14M13 6l6 6-6 6"/>', 2.8)}</button><p class="err" id="err" role="alert"></p>`;
    top();
    let nbp = $("bps").querySelectorAll(".phonef").length;
    wirePhone("mp"); for (let i = 0; i < nbp; i++) wirePhone("bp" + i);
    $("addbp").onclick = () => { $("bps").insertAdjacentHTML("beforeend", phoneField("bp" + nbp)); wirePhone("bp" + nbp); $("bp" + nbp).focus(); nbp++; };
    const barPhones = () => [...$("bps").querySelectorAll("input[type=tel]")].map((x) => phoneOf(x.id)).filter(Boolean);
    $("back").onclick = () => home();
    if ($("chgst")) $("chgst").onclick = () => pick();
    ["ar", "bk"].forEach((id) => $(id).addEventListener("change", () => $(id).classList.toggle("empty", !$(id).value)));
    // A contact we hold: tap to use. Typing over it unpicks it.
    const markC = () => app.querySelectorAll(".wc").forEach((b) => { const c = recC[+b.dataset.c]; b.classList.toggle("on", phoneOf("mp") === c.phone); });
    app.querySelectorAll(".wc").forEach((b) => (b.onclick = () => { const c = recC[+b.dataset.c]; $("mn").value = c.name || ""; const [cc, rest] = splitPhone(c.phone); $("mp_cc").value = cc; $("mp_ccv").textContent = ccLabel(cc); $("mp").value = rest; unflag($("mp")); markC(); }));
    $("mp").addEventListener("input", markC); markC();
    // Prices read like a menu: grouped digits, the row firms up once it has one.
    W.forEach((w) => { const x = $("p-" + w.id); x.addEventListener("input", () => { const d = x.value.replace(/\D/g, "").slice(0, 7); x.value = d.replace(/\B(?=(\d{3})+(?!\d))/g, ","); x.closest(".mrow").classList.toggle("set", !!d); unflag($("mlist")); }); });
    app.querySelectorAll("[data-k]").forEach((b) => (b.onclick = () => { st.kind = b.dataset.k; app.querySelectorAll("[data-k]").forEach((x) => x.classList.toggle("on", x === b)); unflag($("kd")); }));
    // Where it is: from our records for a store we know; otherwise taken quietly from the phone, standing in it.
    const locate = () => new Promise((res) => {
      if (!navigator.geolocation) return res(false);
      navigator.geolocation.getCurrentPosition((p) => { st.lat = +p.coords.latitude.toFixed(6); st.lng = +p.coords.longitude.toFixed(6); st.acc = Math.round(p.coords.accuracy); res(true); },
        () => res(false), { enableHighAccuracy: true, timeout: 15000, maximumAge: 30000 });
    });
    if (needHere) $("here").onclick = async () => {
      const b = $("here"); b.disabled = true; b.querySelector(".go").textContent = "Finding you…";
      const got = await locate(); b.disabled = false; unflag(b);
      if (!got) { b.querySelector(".go").textContent = "I'm here"; return flag(b, ERR.location); }
      b.classList.add("ok"); b.querySelector("small").textContent = "Added. Tap again if you've moved."; b.querySelector(".go").textContent = "Added";
    };
    else if (st.lat == null) locate();
    // A smaller copy of the menu photo, so it sends quickly on a weak signal.
    $("ph").onchange = () => {
      const f = $("ph").files[0]; if (!f) return;
      const img = new Image(), url = URL.createObjectURL(f);
      img.onload = () => { const k = Math.min(1, 1200 / Math.max(img.width, img.height)), c = document.createElement("canvas"); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); st.photo = c.toDataURL("image/jpeg", 0.7); $("pv").src = st.photo; $("pv").hidden = false; $("shot").classList.add("ok"); $("shot").querySelector("small").textContent = "Added. Tap to retake."; URL.revokeObjectURL(url); };
      img.src = url;
    };
    // The bank says whose account it is. If it doesn't look like the store, it waits for Amabile to check.
    const check = async () => {
      st.acct = null; $("an").innerHTML = "";
      const code = $("bk").value, acct = $("ac").value.replace(/\D/g, "");
      if (!code || acct.length !== 10) return;
      $("an").innerHTML = `<div class="acct">Checking with the bank...</div>`;
      const r = await api({ action: "resolve", bankCode: code, account: acct, storeName: $("nm").value });
      if (!r.ok) { $("an").innerHTML = ""; return flag($("ac"), ERR[r.error] || ERR.resolve); }
      st.acct = r;
      $("an").innerHTML = r.matches ? `<div class="acct ok">${esc(r.name)}<small>${esc(r.bank)}</small></div>`
        : `<div class="acct no">${esc(r.name)}<small>This name doesn't look like the store. It will wait for Amabile to check before it goes live.</small></div>`;
    };
    $("bk").onchange = check; $("ac").oninput = () => { if ($("ac").value.replace(/\D/g, "").length === 10) check(); else { st.acct = null; $("an").innerHTML = ""; } };
    $("nm").onchange = () => { if (st.acct) check(); };
    $("send").onclick = async () => {
      $("err").textContent = "";
      const prices = {}; W.forEach((w) => (prices[w.id] = $("p-" + w.id).value));
      const store = { id: pre.id || "", fromRequest: pre.fromRequest || "", outlet: pre.outlet || "", confirmDifferent: st.dupOk, name: $("nm").value.trim(), area: $("ar").value, kind: st.kind, lat: st.lat, lng: st.lng, acc: st.acc, prices,
        managerName: $("mn").value.trim(), managerPhone: phoneOf("mp"), barPhones: barPhones().join(","), bankCode: $("bk").value, account: $("ac").value.replace(/\D/g, ""), menuPhoto: st.photo };
      if (store.name.length < 2 || !store.area) $("sblk").hidden = false;
      if (store.name.length < 2) return flag($("nm"), ERR.name);
      if (!store.area) return flag($("ar"), ERR.area);
      if (!store.kind) { $("sblk").hidden = false; return flag($("kd"), ERR.kind); }
      if (needHere && store.lat == null) return flag($("here"), ERR.here);
      if (store.lat == null) { $("send").disabled = true; const got = await locate(); $("send").disabled = false; if (!got) { $("err").textContent = ERR.location; return; } store.lat = st.lat; store.lng = st.lng; store.acc = st.acc; }
      if (!W.some((w) => String(prices[w.id]).replace(/\D/g, ""))) return flag($("mlist"), ERR.prices);
      if (!store.managerName) return flag($("mn"), ERR.manager_name);
      if (store.managerPhone.replace(/\D/g, "").length < 8) return flag($("mp"), ERR.manager_phone);
      if (store.account && !store.bankCode) return flag($("bk"), ERR.bank);
      if (store.bankCode && store.account.length !== 10) return flag($("ac"), ERR.account_number);
      $("send").disabled = true;
      const r = await api({ action: "submit", store }).finally(() => { $("send").disabled = false; });
      if (!r.ok) {
        const F = { name: "nm", area: "ar", kind: "kd", manager_name: "mn", manager_phone: "mp", bar_phone: "bp0", account_number: "ac", bank: "bk", resolve: "ac" };
        if (r.error === "maybe_duplicate" && r.store) {
          const o = r.store;
          $("err").innerHTML = `<div class="dup"><p>Is this <b>${esc(o.name)}</b>? It's in our records${o.metres != null ? ", " + dist(o.metres) + " away" : ""}${o.status === "live" ? ", already live" : ""}.</p>
            <div class="row2"><button class="btn" id="dupyes" type="button">Yes, it's that one</button><button class="btn ghost" id="dupno" type="button">No, a different place</button></div></div>`;
          $("dupyes").onclick = () => o.status === "live" || o.status === "waiting" ? pick(`<b>${esc(o.name)}</b> is ${o.status === "live" ? "already live on Andiamo!" : "waiting for approval."}`)
            : form({ ...pre, outlet: o.ref, rec: o, name: o.name, area: o.area || pre.area, kind: o.kind || st.kind, lat: st.lat, lng: st.lng, acc: st.acc, locFrom: pre.locFrom });
          $("dupno").onclick = () => { st.dupOk = true; $("err").innerHTML = ""; $("send").click(); };
          $("err").scrollIntoView({ block: "center", behavior: "smooth" }); return;
        }
        if (r.error === "request_taken" && r.by) { $("err").textContent = `${r.by} has already added this store. It's waiting for approval.`; return; }
        if (r.error === "bar_phone") { const bad = [...$("bps").querySelectorAll("input[type=tel]")].find((x) => phoneOf(x.id) === r.bad); return flag(bad || $("bp0"), ERR.bar_phone); }
        return F[r.error] ? flag($(F[r.error]), ERR[r.error]) : ($("err").textContent = ERR[r.error] || ERR.server);
      }
      done(store.name, r);
    };
  }
  function done(name, r) {
    const live = r.stage === "live";
    app.innerHTML = `<div class="panel done"><div class="tick${live ? "" : " wait"}"><svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
      <h1>${live ? esc(name) + " is live" : "Sent for approval"}</h1>
      <p class="muted">${live ? "The manager gets a WhatsApp to sign in to the bar phone. Show them one bottle before you leave."
        : r.held === "name_mismatch" ? "The bank account name doesn't match the store, so Amabile will check it first. We'll WhatsApp you when it's live."
        : "Amabile checks it, then it goes live. We'll WhatsApp you when it does."}</p>
      <button class="btn" id="more">Add another store</button><button class="btn ghost" id="list">Your stores</button></div>`;
    $("more").onclick = () => form({}); $("list").onclick = () => home(); top();
  }

  if (at) home().catch(() => {}); else signIn();
})();
</script>
</body>
</html>
