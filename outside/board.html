<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Runner board · Andiamo!</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#E74529">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root { --red:#E74529; --red-2:#C8371D; --red-soft:#FDECE7; --gold:#F2C66B; --ink:#2B1E17; --ink-2:#6E5D50; --ink-3:#9C8B7D; --bg:#F4E9D6; --card:#FBFAEB; --cream:#F4EBDD; --line:#E6D6B8; --late:#F59E0B; --ok:#1E8E4E;
    --serif:"DM Serif Display", Georgia, serif; --sans:"Nunito", system-ui, -apple-system, sans-serif; --safe-b:env(safe-area-inset-bottom, 0px); --safe-t:env(safe-area-inset-top, 0px); }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); min-height: 100vh; min-height: 100dvh; }
  button { font: inherit; color: inherit; cursor: pointer; }
  /* header */
  header { position: sticky; top: 0; z-index: 5; background: var(--red); color: #fff; border-bottom: 3px solid var(--ink); padding: calc(12px + var(--safe-t)) 16px 12px; }
  .hd { max-width: 640px; margin: 0 auto; display: flex; align-items: center; gap: 12px; }
  .hd .t { flex: 1; min-width: 0; }
  .hd h1 { font-family: var(--serif); font-weight: 400; font-size: 26px; line-height: 1.05; margin: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hd small { display: block; font-size: 9.5px; font-weight: 800; letter-spacing: 1.3px; text-transform: uppercase; opacity: .9; margin-top: 3px; }
  .gear { width: 44px; height: 44px; border-radius: 50%; border: 2.5px solid var(--ink); background: #fff; color: var(--ink); display: flex; align-items: center; justify-content: center; box-shadow: 0 3px 0 rgba(43,30,23,.35); flex: none; padding: 0; }
  .gear svg { width: 22px; height: 22px; }
  .counts { max-width: 640px; margin: 10px auto 0; display: flex; gap: 8px; }
  .counts span { background: rgba(43,30,23,.18); border-radius: 999px; padding: 5px 12px; font-weight: 900; font-size: 13px; }
  .counts span.hot { background: #fff; color: var(--red-2); }
  .paused { background: var(--late); color: var(--ink); text-align: center; padding: 10px 16px; font-weight: 900; border-bottom: 3px solid var(--ink); }
  main { max-width: 640px; margin: 0 auto; padding: 16px 14px calc(110px + var(--safe-b)); }
  .sec { font-family: var(--serif); font-size: 22px; margin: 4px 2px 12px; display: flex; align-items: baseline; gap: 8px; }
  .sec .n { font-family: var(--sans); font-size: 14px; font-weight: 900; color: var(--ink-2); }
  /* a ticket */
  .tk { background: var(--card); border: 2.5px solid var(--ink); border-radius: 22px; overflow: hidden; box-shadow: 0 5px 0 rgba(43,30,23,.2); margin-bottom: 16px; }
  .tk.new { animation: ping 1s ease-in-out 4; } @keyframes ping { 50% { box-shadow: 0 0 0 6px var(--red), 0 5px 0 rgba(43,30,23,.2); } }
  .strip { display: flex; align-items: center; gap: 10px; padding: 11px 14px; color: #fff; border-bottom: 2.5px solid var(--ink); }
  .strip .look { flex: 1; font-weight: 900; font-size: 15px; letter-spacing: 1.2px; text-transform: uppercase; text-shadow: 0 1px 2px rgba(0,0,0,.35); }
  .strip .dot { width: 22px; height: 22px; border-radius: 50%; background: #fff; border: 2.5px solid var(--ink); flex: none; display: flex; align-items: center; justify-content: center; }
  .strip .dot i { width: 10px; height: 10px; border-radius: 50%; display: block; }
  .strip .age { background: rgba(255,255,255,.95); color: var(--ink); border-radius: 999px; padding: 3px 10px; font-weight: 900; font-size: 13px; }
  .strip .age.late { background: var(--ink); color: var(--late); }
  .strip.bar { background: var(--ink); }
  .body { display: flex; gap: 14px; padding: 14px; align-items: center; }
  .pic { width: 70px; height: 92px; border-radius: 14px; background: var(--cream); flex: none; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .pic img { height: 88px; } .pic svg { width: 56px; height: auto; }
  .info { flex: 1; min-width: 0; }
  .who { font-family: var(--serif); font-size: 28px; line-height: 1.05; }
  .what { font-weight: 900; color: var(--red); font-size: 16.5px; margin-top: 4px; }
  .where { font-size: 16px; font-weight: 700; margin-top: 4px; }
  .meta { font-size: 13px; color: var(--ink-2); margin-top: 4px; }
  .chip { display: inline-block; font-size: 11px; font-weight: 900; letter-spacing: .6px; text-transform: uppercase; padding: 2px 8px; border-radius: 999px; background: var(--ink); color: #fff; margin-left: 6px; vertical-align: 4px; font-family: var(--sans); }
  .acts { display: flex; gap: 10px; padding: 0 14px 14px; }
  .btn { flex: 1; border: 2.5px solid var(--ink); border-radius: 999px; padding: 14px 16px; font-weight: 900; font-size: 16px; background: #fff; color: var(--ink); box-shadow: 0 3px 0 var(--ink); }
  .btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--ink); }
  .btn.go { background: var(--red); color: #fff; } .btn.gold { background: var(--gold); }
  .btn.more { flex: none; width: 54px; padding: 0; font-size: 22px; line-height: 1; }
  .btn:disabled { opacity: .5; }
  /* empty and served */
  .empty { text-align: center; padding: 34px 20px 30px; background: var(--card); border: 2.5px dashed var(--line); border-radius: 22px; margin-bottom: 18px; }
  .empty .bell { width: 64px; height: 64px; border-radius: 50%; background: var(--red-soft); color: var(--red); display: flex; align-items: center; justify-content: center; margin: 0 auto 12px; }
  .empty .bell svg { width: 30px; height: 30px; }
  .empty b { font-family: var(--serif); font-weight: 400; font-size: 24px; display: block; margin-bottom: 4px; }
  .empty p { margin: 0 0 12px; color: var(--ink-2); }
  .link { background: none; border: 0; padding: 0; color: var(--red-2); font-weight: 900; text-decoration: underline; text-underline-offset: 3px; }
  details.served { background: var(--card); border: 2.5px solid var(--ink); border-radius: 22px; overflow: hidden; box-shadow: 0 5px 0 rgba(43,30,23,.12); }
  details.served summary { list-style: none; display: flex; align-items: center; gap: 10px; padding: 14px 16px; font-family: var(--serif); font-size: 21px; cursor: pointer; }
  details.served summary::-webkit-details-marker { display: none; }
  details.served summary .n { font-family: var(--sans); font-size: 14px; font-weight: 900; color: var(--ink-2); flex: 1; }
  details.served summary .car { font-family: var(--sans); font-weight: 900; transition: transform .15s; }
  details.served[open] summary .car { transform: rotate(180deg); }
  .row { display: flex; align-items: center; gap: 12px; padding: 11px 16px; border-top: 1.5px solid var(--line); }
  .row .sw { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--ink); flex: none; }
  .row .x { flex: 1; min-width: 0; } .row .x b { display: block; } .row .x span { font-size: 13px; color: var(--ink-2); }
  .paid { font-size: 12px; font-weight: 900; padding: 3px 9px; border-radius: 999px; background: #E2F5E9; color: var(--ok); white-space: nowrap; }
  /* the big scan button */
  .dock { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; padding: 12px 14px calc(12px + var(--safe-b)); background: linear-gradient(180deg, rgba(244,233,214,0) 0%, var(--bg) 35%); }
  .dock .btn { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; max-width: 612px; margin: 0 auto; font-size: 17px; padding: 16px; }
  .dock svg { width: 22px; height: 22px; }
  /* sheets */
  .sheet { position: fixed; inset: 0; background: rgba(30,21,16,.55); display: none; align-items: flex-end; justify-content: center; z-index: 10; }
  .sheet.open { display: flex; }
  .sheet .card { width: 100%; max-width: 520px; background: var(--card); border: 2.5px solid var(--ink); border-bottom: 0; border-radius: 26px 26px 0 0; padding: 10px 18px calc(18px + var(--safe-b)); max-height: calc(100dvh - 24px); overflow-y: auto; animation: rise .18s ease-out; }
  @keyframes rise { from { transform: translateY(30px); opacity: .5; } }
  .sheet .grab { width: 44px; height: 5px; border-radius: 3px; background: var(--line); margin: 0 auto 14px; }
  .sheet h2 { font-family: var(--serif); font-weight: 400; font-size: 26px; color: var(--red); margin: 0 0 6px; line-height: 1.1; }
  .sheet p { margin: 0 0 12px; }
  .stack { display: grid; gap: 10px; }
  .stack .btn { width: 100%; }
  .codebox { display: flex; gap: 10px; justify-content: center; margin: 14px 0 6px; }
  .codebox i { width: 56px; height: 66px; border: 2.5px solid var(--ink); border-radius: 14px; background: #fff; font-style: normal; font-family: var(--serif); font-size: 36px; display: flex; align-items: center; justify-content: center; color: var(--red); }
  .pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; } .pad .btn { font-size: 24px; padding: 13px; }
  .err { color: var(--red-2); font-weight: 800; min-height: 1.2em; margin: 8px 0 0; }
  input { width: 100%; font: inherit; font-size: 20px; padding: 12px 14px; border: 2.5px solid var(--ink); border-radius: 14px; background: #fff; color: var(--ink); }
  input:focus { outline: none; border-color: var(--red); box-shadow: 0 0 0 4px rgba(231,69,41,.15); }
  label.f { display: block; font-weight: 800; font-size: 14px; margin: 14px 0 6px; }
  .toggle { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-top: 1.5px solid var(--line); font-weight: 800; }
  .toggle:first-of-type { border-top: 0; }
  .toggle input { width: 24px; height: 24px; accent-color: var(--red); flex: none; }
  /* sign in */
  .login { max-width: 420px; margin: 0 auto; padding: calc(28px + var(--safe-t)) 16px 30px; }
  .login .brand { display: inline-block; background: var(--red); color: #fff; border: 3px solid var(--ink); border-radius: 16px; padding: 6px 13px 7px; box-shadow: 0 4px 0 rgba(43,30,23,.25); line-height: 1; margin-bottom: 22px; }
  .login .brand b { font-family: var(--serif); font-weight: 400; font-size: 24px; display: block; } .login .brand small { display: block; font-size: 9.5px; font-weight: 800; letter-spacing: 1.2px; text-transform: uppercase; margin-top: 3px; }
  .login h1 { font-family: var(--serif); font-weight: 400; font-size: 38px; line-height: 1.05; margin: 0 0 8px; }
  .login .card { background: var(--card); border: 2.5px solid var(--ink); border-radius: 22px; padding: 6px 18px 18px; box-shadow: 0 5px 0 rgba(43,30,23,.2); margin-top: 18px; }
  .note { text-align: center; color: var(--ink-2); font-weight: 800; padding: 60px 20px; }
</style>
</head>
<body>
<div id="root"></div>
<div class="sheet" id="m"><div class="card" id="mc"></div></div>
<script src="/outside/art.js"></script>
<script>
(() => {
  const API = "/api/outside-board";
  const q = new URLSearchParams(location.search);
  const LS = { get(k) { try { return localStorage.getItem(k); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} }, del(k) { try { localStorage.removeItem(k); } catch {} } };
  // A player's QR opens this page as /board?q=CODE. On a phone already signed in to a venue's board, that venue takes it.
  let pendingQ = (q.get("q") || "").toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 6);
  const venueId = (q.get("v") || (pendingQ ? LS.get("board.last") || "" : "")).replace(/[^a-z0-9]/gi, "");
  const naira = (n) => "₦" + Number(n || 0).toLocaleString("en-NG");
  const BEACONS = { gold: ["#F2B705", "Gold"], pink: ["#FF4FA3", "Pink"], blue: ["#2F8CFF", "Blue"], green: ["#19C37D", "Green"], orange: ["#FF7A1A", "Orange"], purple: ["#9B5CFF", "Purple"] };
  const WINE = { rosso: "Amabile Rosso", bianco: "Amabile Bianco", rosato: "Amabile Rosato", "sp-rose": "Amabile Spumante Rosé", "sp-bianco": "Amabile Spumante Bianco" };
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const A = window.OutsideArt;
  const ICON = {
    gear: '<path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>',
    qr: '<rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><path d="M14 14h3v3h-3zM20 14v.01M14 20h.01M17 17h4v4h-4z"/>',
    bell: '<path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/>'
  };
  const ic = (n) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">${ICON[n]}</svg>`;
  let key = LS.get("board." + venueId) || "", runner = LS.get("board.runner") || "", cursor = "", tickets = new Map(), info = null, role = "runner", seen = new Set(), first = true, audio, fresh = new Set();
  const root = document.getElementById("root");

  function beep() {
    try {
      audio = audio || new (window.AudioContext || window.webkitAudioContext)();
      [0, 0.18, 0.36].forEach((t, i) => { const o = audio.createOscillator(), g = audio.createGain(); o.frequency.value = [880, 1175, 1568][i]; o.connect(g); g.connect(audio.destination);
        g.gain.setValueAtTime(0.0001, audio.currentTime + t); g.gain.exponentialRampToValueAtTime(0.4, audio.currentTime + t + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, audio.currentTime + t + 0.16);
        o.start(audio.currentTime + t); o.stop(audio.currentTime + t + 0.2); });
    } catch {}
    try { navigator.vibrate && navigator.vibrate([200, 80, 200]); } catch {}
  }
  async function call(body) {
    const r = await fetch(API, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ v: venueId, k: key, runner, ...body }) });
    return r.json().catch(() => ({ ok: false }));
  }

  // ---------- sheets (in place of browser pop-ups) ----------
  function modal(html, mount) { const m = document.getElementById("m"), c = document.getElementById("mc"); c.innerHTML = `<div class="grab"></div>` + html; m.classList.add("open"); mount && mount(c); }
  const close = () => { stopCam(); document.getElementById("m").classList.remove("open"); };
  document.getElementById("m").onclick = (e) => { if (e.target.id === "m") close(); };
  const ask = (title, text, yes, no = "Not yet") => new Promise((res) => modal(`<h2>${esc(title)}</h2>${text ? `<p>${text}</p>` : ""}<div class="stack"><button class="btn go" id="y">${esc(yes)}</button><button class="btn" id="n">${esc(no)}</button></div>`, (c) => {
    c.querySelector("#y").onclick = () => { close(); res(true); }; c.querySelector("#n").onclick = () => { close(); res(false); };
  }));
  const tell = (title, text) => modal(`<h2>${esc(title)}</h2><p>${text}</p><div class="stack"><button class="btn" id="ok">OK</button></div>`, (c) => (c.querySelector("#ok").onclick = close));

  // ---------- sign in ----------
  function login(msg) {
    root.innerHTML = `<div class="login"><span class="brand"><b>Andiamo!</b><small>By Amabile di Rosa</small></span><h1>Runner board</h1><p style="margin:0;color:var(--ink-2);font-weight:700">Bottles for this venue ping here. Bring them to the table.</p>
      <div class="card"><label class="f">Venue code</label><input id="k" autocomplete="off" autocapitalize="none" placeholder="From Amabile" value="">
      <label class="f">Your name</label><input id="r" placeholder="e.g. Emeka" value="${esc(runner)}">
      <p class="err">${esc(msg || "")}</p><button class="btn go" id="go" style="width:100%">Open the board</button></div></div>`;
    document.getElementById("go").onclick = () => { key = document.getElementById("k").value.trim(); runner = document.getElementById("r").value.trim() || "Runner"; LS.set("board.runner", runner); poll(true); };
  }
  async function poll(full) {
    if (!venueId) return (root.innerHTML = `<p class="note">${pendingQ ? "To claim this bottle, open your venue's runner board on this phone once, then scan again." : "This board link is missing its venue. Ask Amabile for the board link."}</p>`);
    if (!key) return login();
    const r = await fetch(API + "?v=" + venueId + "&k=" + encodeURIComponent(key) + (full || !cursor ? "" : "&after=" + encodeURIComponent(cursor)));
    if (r.status === 401) { LS.del("board." + venueId); key = ""; return login("That code didn't work."); }
    const d = await r.json().catch(() => null); if (!d || !d.ok) return;
    LS.set("board." + venueId, key); LS.set("board.last", venueId);
    info = d.venue; role = d.role; cursor = d.cursor;
    if (d.full) tickets = new Map();
    let ping = false;
    for (const t of d.tickets) { if (!seen.has(t.id) && t.status === "open" && !first) { ping = true; fresh.add(t.id); setTimeout(() => fresh.delete(t.id), 4500); } seen.add(t.id); tickets.set(t.id, t); }
    first = false;
    if (ping) beep();
    if (!document.getElementById("m").classList.contains("open") || ping) render();
    if (pendingQ) { const c = pendingQ; pendingQ = ""; try { history.replaceState(null, "", location.pathname + "?v=" + venueId); } catch {} claimQr(c); }
  }

  // ---------- the board ----------
  const mins = (t) => Math.max(0, Math.round((Date.now() - t) / 60000));
  const pic = (t) => t.item ? (A ? A.prize(t.icon || "cards", 56) : "") : `<img src="/outside/img/bottle-${esc(t.wine)}.jpg" alt="">`;
  const whereOf = (t) => t.via === "qr" ? "At the bar" : [t.table ? "Table " + t.table : "", t.spot].filter(Boolean).join(" · ") || "Look for their colour";
  function card(t) {
    const [hex, bn] = BEACONS[t.beacon] || ["", ""];
    const m = mins(t.createdAt), late = m >= 15, mine = t.status === "taken" && t.runner === runner;
    const strip = t.via === "qr" || !hex ? `<div class="strip bar"><span class="look">At the bar</span><span class="age${late ? " late" : ""}">${m} min</span></div>`
      : `<div class="strip" style="background:${hex}"><span class="dot"><i style="background:${hex}"></i></span><span class="look">Look for ${esc(bn)}</span><span class="age${late ? " late" : ""}">${m} min${late ? " · late" : ""}</span></div>`;
    const by = [t.label, t.last, t.status === "taken" ? (mine ? "You're on it" : esc(t.runner) + " is on it") : ""].filter(Boolean).join(" · ");
    return `<div class="tk${fresh.has(t.id) ? " new" : ""}">${strip}
      <div class="body"><div class="pic">${pic(t)}</div><div class="info"><div class="who">${esc(t.name || (t.table ? "Table " + t.table : "Guest"))}${t.kind === "drop" ? '<span class="chip">Free drop</span>' : ""}</div>
        <div class="what">${esc(t.item || WINE[t.wine] || t.wine)}${t.swapFrom ? ` <span style="color:var(--ink-2);font-weight:700">(was ${esc(WINE[t.swapFrom])})</span>` : ""}</div>
        <div class="where">${esc(whereOf(t))}</div>${by ? `<div class="meta">${by}</div>` : ""}</div></div>
      <div class="acts">${t.status === "open" ? `<button class="btn gold" data-a="take" data-id="${t.id}">I'm on it</button>` : ""}<button class="btn go" data-a="serve" data-id="${t.id}">Delivered</button><button class="btn more" data-a="more" data-id="${t.id}" aria-label="More">···</button></div></div>`;
  }
  function render() {
    const all = [...tickets.values()];
    const open = all.filter((t) => ["open", "taken"].includes(t.status)).sort((a, b) => a.createdAt - b.createdAt);
    const done = all.filter((t) => t.status === "served").sort((a, b) => b.servedAt - a.servedAt).slice(0, 30);
    const wasOpen = document.querySelector("details.served") && document.querySelector("details.served").open;
    root.innerHTML = `<header><div class="hd"><div class="t"><h1>${esc(info ? info.name : "")}</h1><small>Andiamo! runner board</small></div><button class="gear" id="gear" aria-label="Settings">${ic("gear")}</button></div>
        <div class="counts"><span class="${open.length ? "hot" : ""}">${open.length} waiting</span><span>${done.length} served tonight</span></div></header>
      ${info && info.paused ? `<div class="paused">Claims are paused. Guests can't claim here right now.</div>` : ""}
      <main>${open.length ? `<div class="sec">Waiting <span class="n">oldest first</span></div>` + open.map(card).join("")
        : `<div class="empty"><div class="bell">${ic("bell")}</div><b>All quiet</b><p>New bottles ping and flash here.<br>Keep this screen open.</p><button class="link" id="sound2">Test the sound</button></div>`}
      ${done.length ? `<details class="served"${wasOpen ? " open" : ""}><summary>Served tonight <span class="n">${done.length}</span><span class="car">⌄</span></summary>${done.map((t) => { const [hex] = BEACONS[t.beacon] || ["#fff"];
        return `<div class="row"><span class="sw" style="background:${t.via === "qr" ? "var(--ink)" : hex}"></span><div class="x"><b>${esc(t.name || "Table " + (t.table || ""))}</b><span>${esc(t.item || WINE[t.wine] || "")} · ${new Date(t.servedAt).toLocaleTimeString("en-GB", { hour: "numeric", minute: "2-digit", timeZone: "Africa/Lagos" })}</span></div>${t.paidOut ? `<span class="paid">Paid ${naira(t.paidOut.amount)}</span>` : ""}</div>`; }).join("")}</details>` : ""}</main>
      <div class="dock"><button class="btn go" id="scan">${ic("qr")} Scan a guest's QR</button></div>`;
    root.querySelectorAll("[data-a]").forEach((b) => (b.onclick = () => act(b.dataset.a, tickets.get(b.dataset.id))));
    document.getElementById("scan").onclick = scanner;
    document.getElementById("gear").onclick = settings;
    const s2 = document.getElementById("sound2"); if (s2) s2.onclick = beep;
  }

  async function act(a, t) {
    if (!t) return;
    if (a === "take") { const r = await call({ action: "take", id: t.id }); if (!r.ok && r.error === "taken") tell("Someone's on it", "Another runner already has this one."); return poll(true); }
    if (a === "serve") {
      if (!t.hasPlayer || t.via === "qr") {
        if (!(await ask("Delivered?", `${esc(t.item || WINE[t.wine] || "The bottle")} to <b>${esc(t.via === "qr" ? t.name || "them" : "table " + (t.table || ""))}</b>.`, "Yes, delivered"))) return;
        await call({ action: "serve", id: t.id }); return poll(true);
      }
      let code = "";
      const show = (c) => c.querySelectorAll(".codebox i").forEach((el, i) => (el.textContent = code[i] || ""));
      modal(`<h2>Ask ${esc(t.name || "them")} for their code</h2><p>It's the 4 digits on their screen.</p><div class="codebox"><i></i><i></i><i></i><i></i></div>
        <div class="pad">${[1,2,3,4,5,6,7,8,9,"←",0,"OK"].map((k) => `<button class="btn${k === "OK" ? " go" : ""}" data-k="${k}">${k}</button>`).join("")}</div><p class="err" id="er"></p>`, (c) => {
        c.querySelectorAll("[data-k]").forEach((b) => (b.onclick = async () => {
          const k = b.dataset.k;
          if (k === "←") code = code.slice(0, -1);
          else if (k === "OK") {
            if (code.length < 4) return (c.querySelector("#er").textContent = "Enter all 4 digits.");
            const r = await call({ action: "serve", id: t.id, code });
            if (r.ok) { close(); return poll(true); }
            c.querySelector("#er").textContent = r.error === "code" ? "That code doesn't match. Check their screen." : "Couldn't save. Try again.";
            code = "";
          } else if (code.length < 4) code += k;
          show(c);
        }));
      });
      return;
    }
    if (a === "more") {
      modal(`<h2>${esc(t.name || "This table")}</h2><p style="color:var(--ink-2)">${esc(t.item || WINE[t.wine] || "")} · ${esc(whereOf(t))}</p><div class="stack">
        ${t.kind !== "drop" || t.name ? `<button class="btn" data-m="I'm at the bar with your bottle. Where are you sitting?">Message them: I'm at the bar, where are you?</button><button class="btn" data-m="I'm walking round with your bottle. Tap Glow on your phone so I can see you.">Message them: tap Glow</button>` : ""}
        ${t.item ? "" : `<button class="btn" data-sw>We're out of this wine, swap it</button>`}${t.status === "taken" ? `<button class="btn" data-undo>Put it back for anyone</button>` : ""}
        <button class="btn" data-rel>Can't find them, release it</button><button class="btn" data-x style="border-color:var(--line);box-shadow:none">Close</button></div>`, (c) => {
        c.querySelectorAll("[data-m]").forEach((b) => (b.onclick = async () => { await call({ action: "cantfind", id: t.id, message: b.dataset.m }); close(); tell("Sent", "They'll get it on WhatsApp."); }));
        if (c.querySelector("[data-sw]")) c.querySelector("[data-sw]").onclick = () => modal(`<h2>Swap to</h2><div class="stack">${Object.entries(WINE).filter(([k]) => k !== t.wine).map(([k, n]) => `<button class="btn" data-w="${k}">${esc(n)}</button>`).join("")}</div>`, (c2) => {
          c2.querySelectorAll("[data-w]").forEach((b) => (b.onclick = async () => { await call({ action: "swap", id: t.id, wine: b.dataset.w }); close(); poll(true); }));
        });
        const u = c.querySelector("[data-undo]"); if (u) u.onclick = async () => { await call({ action: "undo", id: t.id }); close(); poll(true); };
        c.querySelector("[data-rel]").onclick = async () => { if (!(await ask("Release this bottle?", "They keep it for another night.", "Release it", "Keep looking"))) return; await call({ action: "release", id: t.id }); poll(true); };
        c.querySelector("[data-x]").onclick = close;
      });
    }
  }

  // ---------- settings: name, sound, manager ----------
  function settings() {
    const out = (info && info.outOf) || {};
    modal(`<h2>Settings</h2><label class="f">Your name</label><div style="display:flex;gap:8px"><input id="nm" value="${esc(runner)}"><button class="btn" id="svn" style="flex:none">Save</button></div>
      <div class="stack" style="margin-top:14px"><button class="btn" id="snd">Test the sound</button></div>
      ${role === "manager" ? `<h2 style="margin-top:22px;font-size:22px">Manager</h2><div class="stack"><button class="btn${info.paused ? " go" : ""}" id="pz">${info.paused ? "Resume claims" : "Pause claims for now"}</button></div>
        <p style="margin:16px 0 0;font-weight:900">Out of stock tonight</p>${Object.entries(WINE).map(([k, n]) => `<label class="toggle"><input type="checkbox" data-w="${k}"${out[k] ? " checked" : ""}> ${esc(n)}</label>`).join("")}` : ""}
      <div class="stack" style="margin-top:18px"><button class="btn" id="x">Done</button><button class="link" id="so" style="justify-self:center;margin-top:4px">Sign out of this board</button></div>`, (c) => {
      c.querySelector("#svn").onclick = () => { runner = c.querySelector("#nm").value.trim() || runner; LS.set("board.runner", runner); close(); render(); };
      c.querySelector("#snd").onclick = beep;
      const pz = c.querySelector("#pz"); if (pz) pz.onclick = async () => { await call({ action: info.paused ? "resume" : "pause" }); close(); poll(true); };
      c.querySelectorAll("[data-w]").forEach((b) => (b.onchange = async () => { await call({ action: "stock", stock: { [b.dataset.w]: b.checked } }); }));
      c.querySelector("#x").onclick = () => { close(); poll(true); };
      c.querySelector("#so").onclick = () => { LS.del("board." + venueId); key = ""; close(); login(); };
    });
  }

  // ---------- scan a player's QR ----------
  let stream = null, scanning = false;
  function stopCam() { scanning = false; try { stream && stream.getTracks().forEach((t) => t.stop()); } catch {} stream = null; }
  function loadJsQR() {
    return window.jsQR ? Promise.resolve() : new Promise((ok, no) => { const sc = document.createElement("script"); sc.src = "/outside/vendor/jsqr.min.js"; sc.onload = ok; sc.onerror = no; document.head.appendChild(sc); });
  }
  const codeFrom = (text) => { try { return new URL(text).searchParams.get("q") || ""; } catch { return text; } };
  async function scanner() {
    modal(`<h2>Scan their QR</h2><p style="color:var(--ink-2)">Point the camera at the code on their phone.</p>
      <video id="cam" playsinline muted style="width:100%;aspect-ratio:1;object-fit:cover;border-radius:18px;background:#1E1510;border:2.5px solid var(--ink);display:block"></video>
      <label class="f">Or type the code under their QR</label>
      <div style="display:flex;gap:8px"><input id="qc" maxlength="6" autocapitalize="characters" autocomplete="off" placeholder="K7M3QX" style="text-transform:uppercase;letter-spacing:3px"><button class="btn go" id="mgo" style="flex:none">Claim</button></div>
      <p class="err" id="er"></p><div class="stack"><button class="btn" id="mx">Close</button></div>`, (c) => {
      c.querySelector("#mx").onclick = () => { stopCam(); close(); };
      c.querySelector("#mgo").onclick = () => { const v = c.querySelector("#qc").value; if (v.trim()) { stopCam(); claimQr(v); } };
    });
    const video = document.getElementById("cam");
    try { stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" }, audio: false }); }
    catch { document.getElementById("er").textContent = "Camera not available. Type the code instead."; return; }
    video.srcObject = stream; await video.play().catch(() => {});
    scanning = true;
    let detect;
    if ("BarcodeDetector" in window) {
      const det = new BarcodeDetector({ formats: ["qr_code"] });
      detect = async () => { const r = await det.detect(video); return r[0] && r[0].rawValue; };
    } else {
      await loadJsQR().catch(() => {});
      const cv = document.createElement("canvas"), cx = cv.getContext("2d", { willReadFrequently: true });
      detect = async () => {
        if (!window.jsQR || !video.videoWidth) return null;
        const w = 480, h = Math.round(480 * video.videoHeight / video.videoWidth); cv.width = w; cv.height = h; cx.drawImage(video, 0, 0, w, h);
        const r = window.jsQR(cx.getImageData(0, 0, w, h).data, w, h); return r && r.data;
      };
    }
    const tick = async () => {
      if (!scanning || !document.getElementById("cam")) return stopCam();
      const text = await detect().catch(() => null);
      if (text) { stopCam(); return claimQr(codeFrom(text)); }
      setTimeout(tick, 250);
    };
    tick();
  }
  async function claimQr(code) {
    const r = await call({ action: "scan", code });
    if (r.ok) {
      const t = r.ticket;
      beep();
      modal(`<h2>Bring it to ${esc(t.name || "them")}</h2><div class="body" style="padding:6px 0 14px"><div class="pic">${pic(t)}</div><div class="info"><div class="what" style="font-size:20px;margin:0">${esc(t.item || WINE[t.wine] || t.wine)}</div><div class="meta">${esc(t.label || "")}${r.again ? " · already claimed, same bottle" : ""}</div></div></div>
        <div class="stack"><button class="btn go" id="dl">Delivered</button><button class="btn" id="lt">Later</button></div>`, (c) => {
        c.querySelector("#dl").onclick = async () => { await call({ action: "serve", id: t.id }); close(); poll(true); };
        c.querySelector("#lt").onclick = () => { close(); poll(true); };
      });
      return;
    }
    const msg = {
      topup: `This bottle is for cheaper spots. They can top up ${naira(r.topup)} on their phone, then it appears here.`,
      not_stocked: `This venue doesn't have ${esc(WINE[r.wine] || "this wine")} on the board. They keep the bottle for another night.`,
      qr_expired: "That QR has expired. Ask them to show a fresh one.", qr_used: "That bottle has already been claimed.",
      qr_unknown: "That isn't an Andiamo bottle code.", paused: "Claims are paused here. A manager can resume them."
    }[r.error] || "Couldn't claim it. Try again.";
    modal(`<h2>Not this time</h2><p style="font-size:18px">${msg}</p><div class="stack"><button class="btn go" id="ag">Scan another</button><button class="btn" id="cl">Close</button></div>`, (c) => {
      c.querySelector("#ag").onclick = scanner; c.querySelector("#cl").onclick = close;
    });
  }

  poll(true);
  setInterval(() => { if (key) poll(false); }, 5000);
  setInterval(() => { if (key && !document.getElementById("m").classList.contains("open")) render(); }, 30000);
  try { navigator.wakeLock && navigator.wakeLock.request("screen"); } catch {}
})();
</script>
</body>
</html>
