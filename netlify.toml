# Netlify — serverless functions live here (publish dir left as configured in the Netlify UI)
[functions]
  directory = "netlify/functions"

# Pretty invite links /i/<code> are owned directly by the invite-ssr function
# (see `export const config = { path: "/i/:code" }` in netlify/functions/invite-ssr.mjs),
# which injects per-invite preview tags (host, vibe, when/where, card image).

# /venue is owned by the venue-ssr function (config.path "/venue"), which injects a
# venue-coded title ("Guest list — <venue>") then serves the static venue.html body.

# WhatsApp sign-in links from respond.io: /o/<signed token> → trade order page, signed in (see waLogin in the platform functions).
[[redirects]]
  from = "/o/:token"
  to = "/trade-order.html?wa=:token&utm_source=whatsapp&utm_medium=respondio"
  status = 302
  force = true

# Short "join the community" bio links (adr.wine/ig, /fb, /tt) → the site's join section,
# skipping the age splash, each carrying its platform's UTM for attribution.
[[redirects]]
  from = "/join"
  to = "https://www.amabiledirosa.com/?utm_source=offline&utm_medium=campaign&utm_campaign=join&utm_content=join_community&join=1#join"
  status = 302
  force = true
[[redirects]]
  from = "/join-ig"
  to = "https://www.amabiledirosa.com/?utm_source=instagram&utm_medium=profile&utm_campaign=link_in_bio&utm_content=join_community&join=1#join"
  status = 302
  force = true
[[redirects]]
  from = "/join-fb"
  to = "https://www.amabiledirosa.com/?utm_source=facebook&utm_medium=profile&utm_campaign=link_in_bio&utm_content=join_community&join=1#join"
  status = 302
  force = true
[[redirects]]
  from = "/join-tt"
  to = "https://www.amabiledirosa.com/?utm_source=tiktok&utm_medium=profile&utm_campaign=link_in_bio&utm_content=join_community&join=1#join"
  status = 302
  force = true

# Clean URL for the team sampling tool.
[[redirects]]
  from = "/sampling"
  to = "/sampling.html"
  status = 200

# TikTok's single bio link → the homepage hub, tagged for TikTok.
[[redirects]]
  from = "/tt"
  to = "https://www.amabiledirosa.com/?utm_source=tiktok&utm_medium=profile&utm_campaign=link_in_bio&utm_content=bio_home"
  status = 302
  force = true

# Short "find a bottle" links (adr.wine/buy + per-platform) → the where-to-buy page, with UTMs.
[[redirects]]
  from = "/buy"
  to = "https://www.amabiledirosa.com/where-to-buy.html?utm_source=offline&utm_medium=campaign&utm_campaign=buy&utm_content=find_a_bottle"
  status = 302
  force = true
[[redirects]]
  from = "/buy-ig"
  to = "https://www.amabiledirosa.com/where-to-buy.html?utm_source=instagram&utm_medium=profile&utm_campaign=link_in_bio&utm_content=find_a_bottle"
  status = 302
  force = true
[[redirects]]
  from = "/buy-fb"
  to = "https://www.amabiledirosa.com/where-to-buy.html?utm_source=facebook&utm_medium=profile&utm_campaign=link_in_bio&utm_content=find_a_bottle"
  status = 302
  force = true
[[redirects]]
  from = "/buy-tt"
  to = "https://www.amabiledirosa.com/where-to-buy.html?utm_source=tiktok&utm_medium=profile&utm_campaign=link_in_bio&utm_content=find_a_bottle"
  status = 302
  force = true

# Spumante: where it is pouring, where to buy, how to send one. Indexable; data in /spumante/places.json.
[[redirects]]
  from = "/spumante"
  to = "/spumante.html"
  status = 200
[[redirects]]
  from = "/spumante-ig"
  to = "/spumante?utm_source=instagram&utm_medium=profile&utm_campaign=link_in_bio&utm_content=spumante"
  status = 302
  force = true
[[redirects]]
  from = "/pouring"
  to = "/spumante?utm_source=offline&utm_medium=campaign&utm_campaign=spumante&utm_content=pouring#rooms"
  status = 302
  force = true

# Bamboa × Amabile "Predict & Win" watch-party subsite (adr.wine/predict on the QR).
[[redirects]]
  from = "/predict"
  to = "https://www.amabiledirosa.com/predict.html?utm_source=watchparty&utm_medium=qr&utm_campaign=bamboa-spain-argentina&utm_content=bamboa"
  status = 302
  force = true

# Password-gated admin / winner-picker (same-domain rewrite, keeps the clean URL).
[[redirects]]
  from = "/predict-admin"
  to = "/predict-admin.html"
  status = 200

# The Amabile Table (invite-only lunch) lives at /table and /table/<edition>?g=<token>,
# owned by the table-ssr function (config.path), which injects per-edition preview tags
# (title, date, venue) then serves the static table.html body. Guests reach it via their
# personal per-guest link; a forwarded link without the token cannot RSVP. table.html is
# noindex and deliberately kept OUT of sitemap.xml.

# Password-gated Table admin (editions, guest lists, standings, CSV) — same-domain rewrite.
[[redirects]]
  from = "/table-admin"
  to = "/table-admin.html"
  status = 200

# Clean shortcuts /new, /pullup, /host are owned by the generator-ssr function
# (config.path), which serves the homepage with a behaviour-led link preview
# ("Round up your crew") and auto-opens the generator on those paths.

# The Room: the team's door page for Table No 1 (faces, seats, who is in). Private by
# obscurity, noindex, never linked. Static file, outside the table-ssr paths and the age gate.
[[redirects]]
  from = "/table/1/room"
  to = "/table/1/room.html"
  status = 200
[[redirects]]
  from = "/table/2/room"
  to = "/table/2/room.html"
  status = 200

# Guests' photo page for Table No 2. Images live in /table/2/p/.
[[redirects]]
  from = "/table/2/photos"
  to = "/table/2/photos.html"
  status = 200

# Host's flash cards. Same rules as the room: obscurity, noindex, never linked.
[[redirects]]
  from = "/table/1/h"
  to = "/table/1/h.html"
  status = 200

# Guests' photo page for Table No 1, sent after the day. Images live in /table/1/p/.
[[redirects]]
  from = "/table/1/photos"
  to = "/table/1/photos.html"
  status = 200

# Seat ordering at The Last Bachelor (18 Oct 2026). Table QRs: /bachelor/12; general QR: /bachelor.
# Board and QR printer are private (noindex, board is password-gated). Specific rules first.
[[redirects]]
  from = "/bachelor/board"
  to = "/show-board.html"
  status = 200
[[redirects]]
  from = "/bachelor/qr"
  to = "/show-qr.html"
  status = 200
[[redirects]]
  from = "/bachelor"
  to = "/show.html"
  status = 200
[[redirects]]
  from = "/bachelor/*"
  to = "/show.html"
  status = 200


# Andiamo! (formerly Outside): the Amabile bottle game. App, claim links, runner board and admin.
# The game's own domain, andiamo.ng (a domain alias on this site), serves the game from its root.
# Paths without a matching file under /outside/ fall through to the game.
[[redirects]]
  from = "/outside/c/*"
  to = "/outside/index.html"
  status = 200
[[redirects]]
  from = "/outside/board"
  to = "/outside/board.html"
  status = 200
[[redirects]]
  from = "/outside/admin"
  to = "/outside/admin.html"
  status = 200
[[redirects]]
  from = "/outside/venue"
  to = "/outside/venue.html"
  status = 200
# Andiamo! (formerly Outside) lives on andiamo.ng. www, andiamolagos.ng and the old weoutside.ng all forward there,
# keeping the path, so card links already sent (/c/..., /g/...) still open.
[[redirects]]
  from = "https://www.andiamo.ng/*"
  to = "https://andiamo.ng/:splat"
  status = 301
  force = true
[[redirects]]
  from = "https://weoutside.ng/*"
  to = "https://andiamo.ng/:splat"
  status = 301
  force = true
[[redirects]]
  from = "https://www.weoutside.ng/*"
  to = "https://andiamo.ng/:splat"
  status = 301
  force = true
[[redirects]]
  from = "https://andiamolagos.ng/*"
  to = "https://andiamo.ng/:splat"
  status = 301
  force = true
[[redirects]]
  from = "https://www.andiamolagos.ng/*"
  to = "https://andiamo.ng/:splat"
  status = 301
  force = true
# On andiamo.ng: API, functions and the game's own files pass through; everything else is the game.
[[redirects]]
  from = "https://andiamo.ng/api/*"
  to = "/api/:splat"
  status = 200
  force = true
[[redirects]]
  from = "https://andiamo.ng/.netlify/*"
  to = "/.netlify/:splat"
  status = 200
  force = true
[[redirects]]
  from = "https://andiamo.ng/outside/*"
  to = "/outside/:splat"
  status = 200
  force = true
[[redirects]]
  from = "https://andiamo.ng/favicon-32.png"
  to = "/favicon-32.png"
  status = 200
  force = true
[[redirects]]
  from = "https://andiamo.ng/g/*"
  to = "/outside/g/:splat"
  status = 200
  force = true
[[redirects]]
  from = "https://andiamo.ng/"
  to = "/outside/index.html"
  status = 200
  force = true
[[redirects]]
  from = "https://andiamo.ng/c/*"
  to = "/outside/index.html"
  status = 200
  force = true
[[redirects]]
  from = "https://andiamo.ng/board"
  to = "/outside/board.html"
  status = 200
  force = true
[[redirects]]
  from = "https://andiamo.ng/admin"
  to = "/outside/admin.html"
  status = 200
  force = true
[[redirects]]
  from = "https://andiamo.ng/venue"
  to = "/outside/venue.html"
  status = 200
  force = true
[[redirects]]
  from = "https://andiamo.ng/*"
  to = "/outside/:splat"
  status = 200
  force = true
